<script>
  function saveCachedLicense(license) {
    localStorage.setItem(LICENSE_CACHE_KEY, JSON.stringify(license));
  }

  function clearCachedLicense() {
    localStorage.removeItem(LICENSE_CACHE_KEY);
  }

  async function validateLicenseOnline(key, countLogin = true) {
    const trimmed = String(key || "").trim();
    if (!trimmed) return { ok: false, message: "يرجى إدخال المفتاح" };
    if (!navigator.onLine) return { ok: false, message: "يلزم توفر الإنترنت لأول مرة للتحقق من المفتاح" };

    await ensureFirebaseReady();
    const { ref, get, update } = window.feeFirebase;
    const installationId = generateInstallationId();

    try {
      const licenseRef = ref(firebaseDbRef, `${LICENSE_PATH}/${trimmed}`);
      const snapshot = await get(licenseRef);

      if (!snapshot.exists()) return { ok: false, message: "المفتاح غير صالح" };

      const remoteLicense = snapshot.val() || {};
      if (remoteLicense.status !== "active") return { ok: false, message: "هذا المفتاح معطل" };

      const isPermanent = !!remoteLicense.isPermanent;
      const expiresAt = isPermanent ? null : Number(remoteLicense.expiresAt || 0);
      const allowUnlimitedDevices = !!remoteLicense.allowUnlimitedDevices;
      const maxDevices = allowUnlimitedDevices ? null : Number(remoteLicense.maxDevices || 1);
      const loginCount = Number(remoteLicense.loginCount || 0);
      const syncMode = remoteLicense.syncMode || "online_sync";

      if (!isPermanent && expiresAt && Date.now() >= expiresAt) {
        return { ok: false, message: "المفتاح منتهي" };
      }

      if (countLogin && !allowUnlimitedDevices && loginCount >= maxDevices) {
        return { ok: false, message: "تم استهلاك عدد الأجهزة المسموح" };
      }

      if (countLogin) {
        const payload = {
          lastLoginAt: Date.now(),
          lastInstallationId: installationId
        };
        if (!allowUnlimitedDevices) payload.loginCount = loginCount + 1;
        await update(licenseRef, payload);
      }

      const customSnap = await get(ref(firebaseDbRef, getLicenseSettingsPath(trimmed)));
      const custom = customSnap.exists() ? (customSnap.val() || {}) : {};

      const licenseData = {
        key: trimmed,
        companyName: custom.companyName || remoteLicense.companyName || DEFAULT_SETTINGS.companyName,
        logo: remoteLicense.logo || "",
        planType: remoteLicense.planType || "regular",
        isPermanent,
        expiresAt,
        status: remoteLicense.status || "active",
        usersEnabled: !!remoteLicense.usersEnabled,
        allowUnlimitedDevices,
        maxDevices,
        syncMode,
        cachedAt: Date.now(),
        installationId
      };

      return { ok: true, license: licenseData };
    } catch (error) {
      console.error(error);
      return { ok: false, message: "تعذر التحقق من المفتاح" };
    }
  }

  function handleLicenseLoginClick() {
    handleLogin();
  }

  async function handleLogin() {
    clearLoginStatus(false);

    const key = document.getElementById("licenseKeyInput").value.trim();
    const btn = document.getElementById("loginBtn");

    btn.disabled = true;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin ml-2"></i> جارٍ التحقق...`;

    try {
      const result = await validateLicenseOnline(key, true);
      if (!result.ok) {
        showLoginStatus(result.message || "تعذر تسجيل الدخول", "error", false);
        return;
      }

      saveCachedLicense(result.license);
      setForceLoginOnly(false);
      clearSessionState();
      resetStateForCurrentKey();

      if (!state.data.settings.companyName || state.data.settings.companyName === DEFAULT_SETTINGS.companyName) {
        state.data.settings.companyName = result.license.companyName || state.data.settings.companyName;
        state.data.settings.shopName = result.license.companyName || state.data.settings.shopName;
      }
      if (result.license.logo) state.data.settings.logo = result.license.logo;

      state.session = getDefaultAdminSession();

      saveAppState();
      applyTheme();
      setShell("app");

      if (!isLocalOnlyMode()) {
        await pullFullStateFromCloud();
        await attachRealtimeSync();
      }

      updateConnectionUI();
      state.syncStatus = "idle";
      hideTopSync();
      render();
      showToast("تم تسجيل الدخول بنجاح", "success");
    } finally {
      btn.disabled = false;
      btn.textContent = "دخول";
    }
  }

  async function handleEmployeeLogin() {
    clearLoginStatus(true);

    const usernameInput = document.getElementById("employeeUsername");
    const passwordInput = document.getElementById("employeePassword");
    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();
    const btn = document.getElementById("employeeLoginBtn");

    if (!username || !password) {
      showLoginStatus("يرجى إدخال اسم المستخدم وكلمة المرور", "error", true);
      return;
    }

    btn.disabled = true;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin ml-2"></i> جارٍ الدخول...`;

    try {
      if (!navigator.onLine) {
        showLoginStatus("دخول الموظف المباشر يحتاج إنترنت", "error", true);
        return;
      }

      await ensureFirebaseReady();
      const { ref, get } = window.feeFirebase;

      const userSnap = await get(ref(firebaseDbRef, `fee_employee_accounts/${username}`));
      if (!userSnap.exists()) {
        passwordInput.value = "";
        showLoginStatus("اسم المستخدم أو كلمة المرور غير صحيحة", "error", true);
        return;
      }

      const remoteUser = userSnap.val() || {};
      if ((remoteUser.password || "") !== password) {
        passwordInput.value = "";
        showLoginStatus("اسم المستخدم أو كلمة المرور غير صحيحة", "error", true);
        return;
      }

      if (remoteUser.isActive === false) {
        passwordInput.value = "";
        showLoginStatus("هذا الحساب معطل", "error", true);
        return;
      }

      const companyKey = remoteUser.companyKey || remoteUser.licenseKey || "";
      if (!companyKey) {
        passwordInput.value = "";
        showLoginStatus("الحساب غير مربوط بشركة", "error", true);
        return;
      }

      const licenseResult = await validateLicenseOnline(companyKey, false);
      if (!licenseResult.ok) {
        passwordInput.value = "";
        showLoginStatus("تعذر تحميل بيانات الشركة لهذا الموظف", "error", true);
        return;
      }

      saveCachedLicense(licenseResult.license);
      setForceLoginOnly(false);
      resetStateForCurrentKey();

      state.data.settings.companyName = licenseResult.license.companyName || state.data.settings.companyName;
      state.data.settings.shopName = licenseResult.license.companyName || state.data.settings.shopName;
      if (licenseResult.license.logo) state.data.settings.logo = licenseResult.license.logo;

      if (!isLocalOnlyMode()) {
        await pullFullStateFromCloud();
        await attachRealtimeSync();
      }

      let localUser = (state.data.users || []).find(u => u.username === username);

      if (!localUser) {
        localUser = {
          id: remoteUser.id || uid("user"),
          name: remoteUser.name || username,
          username,
          password,
          role: remoteUser.role || "user",
          isActive: remoteUser.isActive !== false,
          permissions: { ...(remoteUser.permissions || EMPLOYEE_DEFAULT_PERMISSIONS) },
          createdAt: remoteUser.createdAt || new Date().toISOString()
        };
        state.data.users.push(localUser);
      } else {
        localUser.name = remoteUser.name || localUser.name || username;
        localUser.password = remoteUser.password || localUser.password || password;
        localUser.role = remoteUser.role || localUser.role || "user";
        localUser.isActive = remoteUser.isActive !== false;
        localUser.permissions = {
          ...(localUser.role === "admin" ? DEFAULT_USER_PERMISSIONS : EMPLOYEE_DEFAULT_PERMISSIONS),
          ...(remoteUser.permissions || localUser.permissions || {})
        };
      }

      state.session = normalizeSession({
        userId: localUser.id,
        displayName: localUser.name || localUser.username,
        role: localUser.role || "user",
        loginSource: "employee_direct",
        permissions: {
          ...(localUser.role === "admin" ? DEFAULT_USER_PERMISSIONS : EMPLOYEE_DEFAULT_PERMISSIONS),
          ...(localUser.permissions || {})
        }
      });

      try {
        localStorage.setItem(getEmployeeLastUsernameKey(), username);
      } catch {}

      saveAppState();
      applyTheme();
      setShell("app");
      updateConnectionUI();
      state.syncStatus = "idle";
      hideTopSync();
      render();
      showToast(`مرحبًا ${state.session.displayName}`, "success");
    } finally {
      btn.disabled = false;
      btn.textContent = "دخول موظف";
    }
  }

  function restoreSavedEmployeeUsername() {
    try {
      const saved = localStorage.getItem(getEmployeeLastUsernameKey()) || "";
      const input = document.getElementById("employeeUsername");
      if (input && saved) input.value = saved;
    } catch {}
  }

  function initLoginTabs() {
    document.getElementById("licenseTabBtn").addEventListener("click", () => setLoginMode("license"));
    document.getElementById("employeeTabBtn").addEventListener("click", () => {
      setLoginMode("employee");
      restoreSavedEmployeeUsername();
    });
  }

  function bootstrapLicenseFlow() {
    const cached = getCurrentLicense();

    if (shouldForceLoginOnly()) {
      clearSessionState();
      state.session = getEmptyLoggedOutSession();
      setShell("login");
      setLoginMode(localStorage.getItem(LOGIN_MODE_KEY) || "employee");
      restoreSavedEmployeeUsername();
      return;
    }

    if (!cached) {
      clearSessionState();
      state.session = getEmptyLoggedOutSession();
      setShell("login");
      setLoginMode(localStorage.getItem(LOGIN_MODE_KEY) || "license");
      restoreSavedEmployeeUsername();
      return;
    }

    if (isLicenseExpired(cached)) {
      clearSessionState();
      document.getElementById("expiredTitle").textContent = "انتهى الاشتراك";
      document.getElementById("expiredText").textContent = "انتهت صلاحية المفتاح. يرجى إدخال مفتاح صالح.";
      setShell("expired");
      return;
    }

    resetStateForCurrentKey();

    if (cached.companyName && (!state.data.settings.companyName || state.data.settings.companyName === DEFAULT_SETTINGS.companyName)) {
      state.data.settings.companyName = cached.companyName;
      state.data.settings.shopName = cached.companyName;
    }
    if (cached.logo && !state.data.settings.logo) {
      state.data.settings.logo = cached.logo;
    }

    const restoredSession = loadSessionState();

    if (restoredSession.loginSource === "logged_out") {
      setShell("login");
      setLoginMode(localStorage.getItem(LOGIN_MODE_KEY) || "employee");
      restoreSavedEmployeeUsername();
      return;
    }

    state.session = normalizeSession(restoredSession);

    applyTheme();
    setShell("app");
    updateConnectionUI();
    hideTopSync();

    if (isLocalOnlyMode()) {
      render();
      return;
    }

    pullFullStateFromCloud().then(() => {
      attachRealtimeSync();
      render();
    });
  }

  function init() {
    initLoginTabs();

    document.getElementById("loginBtn").addEventListener("click", handleLicenseLoginClick);
    document.getElementById("employeeLoginBtn").addEventListener("click", handleEmployeeLogin);

    document.getElementById("licenseKeyInput").addEventListener("keydown", e => {
      if (e.key === "Enter") handleLicenseLoginClick();
    });

    document.getElementById("employeeUsername").addEventListener("keydown", e => {
      if (e.key === "Enter") handleEmployeeLogin();
    });

    document.getElementById("employeePassword").addEventListener("keydown", e => {
      if (e.key === "Enter") handleEmployeeLogin();
    });

    document.getElementById("goToLoginBtn").addEventListener("click", () => {
      clearSessionState();
      clearCachedLicense();
      detachRealtimeSync();
      setForceLoginOnly(false);
      state.session = getEmptyLoggedOutSession();
      setShell("login");
      setLoginMode("license");
    });

    window.addEventListener("online", async () => {
      updateConnectionUI();
      if (!isLocalOnlyMode()) {
        await syncQueueToCloud();
        await attachRealtimeSync();
      }
      render();
    });

    window.addEventListener("offline", () => {
      updateConnectionUI();
      hideTopSync();
      render();
    });

    window.onpopstate = function() {
      if (state.screenStack.length > 1) {
        state.screenStack.pop();
        state.currentScreen = state.screenStack[state.screenStack.length - 1];
        saveAppState();
        render();
      } else {
        history.pushState(null, null, window.location.pathname);
      }
    };

    history.pushState(null, null, window.location.pathname);
    bootstrapLicenseFlow();
    restoreSavedEmployeeUsername();
    updateAlertsBadge();
  }

  init();
</script>

  .fee-scan-close{position:fixed;top:18px;left:18px;z-index:100005;border:0;border-radius:18px;background:rgba(15,23,42,.85);color:#fff;padding:12px 16px;font-weight:900}.fee-scan-toast{position:fixed;right:16px;left:16px;bottom:28px;z-index:100004;padding:15px 18px;border-radius:18px;background:rgba(15,23,42,.96);color:#fff;font-size:16px;font-weight:900;text-align:center;box-shadow:0 18px 45px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);transform:translateY(130%);opacity:0;transition:.25s ease;direction:ltr}.fee-scan-toast.show{transform:translateY(0);opacity:1}
  @media(max-width:640px){.fee-cashier-cart-line{grid-template-columns:1fr 72px 72px 38px}.fee-product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom-nav .nav-btn{min-width:62px}.bottom-nav .nav-btn span{font-size:9px!important}}
</style>

<script id="fee-legacy-merge-script">
(function(){
  "use strict";
  const EXTRA_KEYS = ["products","expenses","paymentAccounts","supplierPayments","suppliers"];
  const $ = (id) => document.getElementById(id);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  let cashierCart = [];
  let currentScanTarget = null;
  let currentScanMode = "input";
  let scanner = null;
  let scannerRunning = false;
  let lastScanCode = "";
  let lastScanTime = 0;
  const scanSound = new Audio("./qr.mp3");
  scanSound.preload = "auto";
  scanSound.volume = 1;

  function readSavedState(){
    try { return JSON.parse(localStorage.getItem(getAppStateKey()) || "null") || {}; } catch { return {}; }
  }

  function normalizeMergedData(){
    const saved = readSavedState();
    EXTRA_KEYS.forEach(key => {
      if (!Array.isArray(state.data[key])) state.data[key] = Array.isArray(saved[key]) ? saved[key] : [];
    });
    if (!state.data.meta || typeof state.data.meta !== "object") state.data.meta = {};
    if (saved.meta && !state.data.meta.lastBackupAt) state.data.meta.lastBackupAt = saved.meta.lastBackupAt || "";
    state.data.products = state.data.products.map(p => ({
      id: p.id || uid("prod"),
      code: p.code || p.barcode || "",
      barcode: p.barcode || p.code || "",
      name: p.name || "صنف بدون اسم",
      category: p.category || "عام",
      unit: p.unit || "قطعة",
      stock: Number(p.stock || 0),
      costPrice: Number(p.costPrice || p.cost || 0),
      salePrice: Number(p.salePrice || p.price || 0),
      createdAt: p.createdAt || new Date().toISOString(),
      updatedAt: p.updatedAt || p.createdAt || new Date().toISOString()
    }));
    state.data.paymentAccounts = state.data.paymentAccounts.map(a => ({
      id: a.id || uid("acc"),
      name: a.name || "حساب دفع",
      type: a.type || "cash",
      number: a.number || "",
      balance: Number(a.balance || 0),
      movements: Array.isArray(a.movements) ? a.movements : [],
      createdAt: a.createdAt || new Date().toISOString()
    }));
  }

  function patchNavigation(){
    const nav = document.querySelector(".bottom-nav");
    if (nav && !nav.dataset.feeMergedNav) {
      nav.dataset.feeMergedNav = "1";
      const addBtn = (screen, icon, label, beforeId) => {
        if ($("nav-" + screen)) return;
        const btn = document.createElement("button");
        btn.id = "nav-" + screen;
        btn.className = "flex flex-col items-center p-2 text-gray-500 nav-btn";
        btn.setAttribute("onclick", `navigate('${screen}')`);
        btn.innerHTML = `<i class="fas ${icon} text-[22px]"></i><span class="text-[10px] mt-1">${label}</span>`;
        const before = beforeId ? $(beforeId) : null;
        if (before) nav.insertBefore(btn, before); else nav.appendChild(btn);
      };
      addBtn("cashier", "fa-cash-register", "الكاشير", "nav-customers");
      addBtn("inventory", "fa-boxes-stacked", "الأصناف", "nav-customers");
      addBtn("expenses", "fa-money-bill-wave", "المصاريف", "nav-reports");
      addBtn("accounts", "fa-wallet", "الحسابات", "nav-settings");
      addBtn("supplierPayments", "fa-hand-holding-dollar", "دفعات", "nav-settings");
    }
  }

  function markActiveNav(screen){
    $$(".nav-btn").forEach(btn => {
      const id = (btn.id || "").replace(/^nav-/, "");
      const active = id === screen || (id === "customers" && screen === "customerDetail") || (id === "invoices" && screen === "invoiceDetail");
      btn.classList.toggle("text-blue-600", active);
      btn.classList.toggle("text-[var(--primary)]", active);
      btn.classList.toggle("text-gray-500", !active);
    });
  }

  function renderMergedShell(container, renderer){
    rebuildCustomerBalances();
    applyTheme();
    updateHeader();
    updatePendingSyncBadge();
    updateAlertsBadge();
    patchNavigation();
    markActiveNav(state.currentScreen);
    renderer(container);
  }

  function productSearch(q){
    const text = String(q || "").trim().toLowerCase();
    const arr = state.data.products || [];
    if (!text) return arr.slice(0, 24);
    return arr.filter(p =>
      (p.name || "").toLowerCase().includes(text) ||
      (p.barcode || "").toLowerCase().includes(text) ||
      (p.code || "").toLowerCase().includes(text) ||
      (p.category || "").toLowerCase().includes(text)
    ).slice(0, 40);
  }

  function renderTopFeatureRibbon(active=""){
    const items = [
      ["cashier","fa-cash-register","الكاشير"],
      ["inventory","fa-boxes-stacked","الأصناف"],
      ["invoices","fa-file-invoice","الفواتير"],
      ["customers","fa-users","العملاء"],
      ["expenses","fa-money-bill-wave","المصاريف"],
      ["accounts","fa-wallet","حسابات الدفع"],
      ["supplierPayments","fa-hand-holding-dollar","دفعات التجار"],
      ["reports","fa-chart-pie","التقارير"]
    ];
    return `<div class="fee-merge-ribbon no-print">${items.map(([s,i,l]) => `<button type="button" class="${active===s?'active':''}" onclick="navigate('${s}')"><i class="fas ${i}"></i><br>${l}</button>`).join("")}</div>`;
  }

  function renderCashier(el){
    normalizeMergedData();
    const q = $("fee-cashier-search")?.value || "";
    const products = productSearch(q);
    const subtotal = cashierCart.reduce((a,l)=> a + Number(l.qty || 0) * Number(l.price || 0), 0);
    const discount = parseNumber($("fee-cashier-discount")?.value || 0);
    const paidValue = $("fee-cashier-paid")?.value;
    const total = Math.max(0, subtotal - discount);
    const paid = paidValue === undefined || paidValue === "" ? total : parseNumber(paidValue);
    const remaining = Math.max(0, total - paid);
    const accountOptions = (state.data.paymentAccounts || []).map(a => `<option value="${a.id}">${escapeHtml(a.name)} - ${formatCurrency(a.balance)}</option>`).join("");
    el.innerHTML = `
      <div class="space-y-5">
        ${renderTopFeatureRibbon("cashier")}
        <div class="flex justify-between items-center gap-3 flex-wrap">
          <div><h2 class="text-2xl font-extrabold text-slate-800">الكاشير</h2><p class="text-sm text-slate-500 mt-1">بيع سريع، باركود، دين، وخصم من المخزون تلقائيًا</p></div>
          <div class="flex gap-2 flex-wrap">
            <button onclick="openFeeScanner('fee-cashier-search','cashier')" class="btn bg-slate-900 text-white px-4 py-3 rounded-2xl font-extrabold"><i class="fas fa-camera"></i> باركود</button>
            <button onclick="openManualCashierItemModal()" class="btn bg-blue-600 text-white px-4 py-3 rounded-2xl font-extrabold"><i class="fas fa-plus"></i> صنف يدوي</button>
          </div>
        </div>
        <div class="grid lg:grid-cols-[1fr_370px] gap-4 items-start">
          <div class="fee-card p-4">
            <input id="fee-cashier-search" class="input" placeholder="بحث بالاسم أو الباركود..." value="${escapeHtml(q)}" oninput="render()">
            <div class="fee-product-grid mt-4">
              ${products.map(p => `
                <button class="fee-product-tile btn" onclick="addProductToCart('${p.id}')">
                  <div class="w-12 h-12 rounded-2xl text-white flex items-center justify-center mb-3" style="background:linear-gradient(135deg,var(--primary),var(--primary-2))"><i class="fas fa-box"></i></div>
                  <div class="font-extrabold text-slate-800 truncate">${escapeHtml(p.name)}</div>
                  <div class="text-xs text-slate-500 mt-1 truncate">${escapeHtml(p.barcode || p.code || '')}</div>
                  <div class="flex justify-between items-center mt-3 text-sm"><span class="font-extrabold text-blue-700">${formatCurrency(p.salePrice)}</span><span class="badge ${Number(p.stock)>0?'badge-green':'badge-red'}">${Number(p.stock || 0)} ${escapeHtml(p.unit || '')}</span></div>
                </button>
              `).join("") || `<div class="col-span-full text-center text-slate-400 py-10">لا توجد أصناف. أضف أصناف من قسم الأصناف.</div>`}
            </div>
          </div>
          <div class="fee-card p-4 sticky top-[92px]">
            <h3 class="font-extrabold text-xl mb-3"><i class="fas fa-receipt"></i> السلة</h3>
            <div id="fee-cart-list" class="max-h-[330px] overflow-auto">
              ${cashierCart.map((l,idx)=> `
                <div class="fee-cashier-cart-line">
                  <div><div class="font-extrabold text-slate-800 truncate">${escapeHtml(l.name)}</div><div class="text-xs text-slate-500">${formatCurrency(l.price)}</div></div>
                  <input class="input" type="number" min="0.001" step="0.001" value="${l.qty}" onchange="setCartQty(${idx},this.value)">
                  <input class="input" type="number" min="0" step="0.01" value="${l.price}" onchange="setCartPrice(${idx},this.value)">
                  <button class="fee-action-chip red" onclick="removeCartLine(${idx})"><i class="fas fa-trash"></i></button>
                </div>
              `).join("") || `<div class="text-center text-slate-400 py-8">السلة فارغة</div>`}
            </div>
            <div class="mt-4 grid grid-cols-2 gap-2">
              <div><label class="block text-xs font-bold text-slate-600 mb-1">خصم</label><input id="fee-cashier-discount" class="input" type="number" step="0.01" value="${discount}" oninput="render()"></div>
              <div><label class="block text-xs font-bold text-slate-600 mb-1">مدفوع الآن</label><input id="fee-cashier-paid" class="input" type="number" step="0.01" value="${paid}" oninput="render()"></div>
            </div>
            <div class="mt-3 grid grid-cols-1 gap-2">
              <input id="fee-cashier-customer" class="input" placeholder="اسم الزبون، اتركه فارغ لكاش" oninput="showFeeCustomerQuickSuggest(this.value,'fee-cashier-cust-suggest')">
              <input id="fee-cashier-customer-id" type="hidden">
              <div id="fee-cashier-cust-suggest" class="suggestions-box hidden-force"></div>
              <select id="fee-cashier-account" class="select"><option value="">بدون حساب دفع</option>${accountOptions}</select>
            </div>
            <div class="mt-4 space-y-2 text-sm">
              <div class="flex justify-between"><span>المجموع</span><b>${formatCurrency(subtotal)}</b></div>
              <div class="flex justify-between"><span>الإجمالي</span><b class="text-blue-700">${formatCurrency(total)}</b></div>
              <div class="flex justify-between"><span>المتبقي دين</span><b class="text-red-600">${formatCurrency(remaining)}</b></div>
            </div>
            <button onclick="completeCashierSale()" class="btn w-full mt-4 bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-extrabold"><i class="fas fa-check"></i> حفظ الفاتورة</button>
            <button onclick="clearCashierCart()" class="btn w-full mt-2 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-2xl font-extrabold">تفريغ السلة</button>
          </div>
        </div>
      </div>`;
  }

  function renderInventory(el){
    normalizeMergedData();
    const q = $("fee-inventory-search")?.value || "";
    const rows = productSearch(q);
    const totalStockValue = (state.data.products || []).reduce((a,p)=> a + Number(p.stock||0)*Number(p.costPrice||0),0);
    el.innerHTML = `
      <div class="space-y-5">
        ${renderTopFeatureRibbon("inventory")}
        <div class="flex justify-between items-center gap-3 flex-wrap"><div><h2 class="text-2xl font-extrabold text-slate-800">الأصناف والمخزون</h2><p class="text-sm text-slate-500 mt-1">إدارة الأصناف والباركود والأسعار والكميات</p></div><div class="flex gap-2 flex-wrap"><button onclick="exportInventoryExcel()" class="btn bg-emerald-600 text-white px-4 py-3 rounded-2xl font-extrabold">Excel</button><button onclick="showProductModal()" class="btn bg-blue-600 text-white px-4 py-3 rounded-2xl font-extrabold"><i class="fas fa-plus"></i> إضافة صنف</button></div></div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3"><div class="fee-mini-stat"><small>عدد الأصناف</small><b>${state.data.products.length}</b></div><div class="fee-mini-stat"><small>قيمة المخزون</small><b>${formatCurrency(totalStockValue)}</b></div><div class="fee-mini-stat"><small>منخفض/منتهي</small><b class="text-red-600">${state.data.products.filter(p=>Number(p.stock)<=0).length}</b></div><div class="fee-mini-stat"><small>تصنيفات</small><b>${new Set(state.data.products.map(p=>p.category||'عام')).size}</b></div></div>
        <div class="fee-card p-4"><input id="fee-inventory-search" class="input" placeholder="بحث بالاسم أو الباركود أو التصنيف" value="${escapeHtml(q)}" oninput="render()"></div>
        <div class="fee-table-wrap"><table class="table-modern min-w-[920px]"><thead><tr><th>الكود</th><th>الصنف</th><th>التصنيف</th><th>الباركود</th><th>المخزون</th><th>الجملة</th><th>البيع</th><th>إجراءات</th></tr></thead><tbody>
          ${rows.map(p => `<tr><td>${escapeHtml(p.code)}</td><td class="font-extrabold">${escapeHtml(p.name)}</td><td>${escapeHtml(p.category)}</td><td dir="ltr">${escapeHtml(p.barcode)}</td><td><span class="badge ${Number(p.stock)>0?'badge-green':'badge-red'}">${Number(p.stock||0)} ${escapeHtml(p.unit||'')}</span></td><td>${formatCurrency(p.costPrice)}</td><td>${formatCurrency(p.salePrice)}</td><td><div class="flex gap-1 flex-wrap"><button class="fee-action-chip blue" onclick="showProductModal('${p.id}')">تعديل</button><button class="fee-action-chip red" onclick="deleteProduct('${p.id}')">حذف</button></div></td></tr>`).join("") || `<tr><td colspan="8" class="text-center text-slate-400 py-10">لا توجد أصناف</td></tr>`}
        </tbody></table></div>
      </div>`;
  }

  function renderExpenses(el){
    normalizeMergedData();
    const expenses = [...(state.data.expenses || [])].sort((a,b)=> new Date(b.date)-new Date(a.date));
    const total = expenses.reduce((a,e)=> a + Number(e.amount||0),0);
    el.innerHTML = `
      <div class="space-y-5">${renderTopFeatureRibbon("expenses")}
        <div class="flex justify-between items-center gap-3 flex-wrap"><div><h2 class="text-2xl font-extrabold">المصاريف</h2><p class="text-sm text-slate-500 mt-1">المصاريف تخصم من حساب الدفع المختار وتظهر في التقارير</p></div><div class="flex gap-2"><button onclick="exportExpensesExcel()" class="btn bg-emerald-600 text-white px-4 py-3 rounded-2xl font-extrabold">Excel</button><button onclick="showExpenseModal()" class="btn bg-blue-600 text-white px-4 py-3 rounded-2xl font-extrabold"><i class="fas fa-plus"></i> مصروف</button></div></div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3"><div class="fee-mini-stat"><small>عدد المصاريف</small><b>${expenses.length}</b></div><div class="fee-mini-stat"><small>الإجمالي</small><b class="text-red-600">${formatCurrency(total)}</b></div><div class="fee-mini-stat"><small>هذا الشهر</small><b>${formatCurrency(expenses.filter(e=>new Date(e.date).getMonth()===new Date().getMonth()&&new Date(e.date).getFullYear()===new Date().getFullYear()).reduce((a,e)=>a+Number(e.amount||0),0))}</b></div></div>
        <div class="fee-table-wrap"><table class="table-modern min-w-[780px]"><thead><tr><th>التاريخ</th><th>البند</th><th>المبلغ</th><th>حساب الدفع</th><th>ملاحظات</th><th>إجراءات</th></tr></thead><tbody>${expenses.map(e=>`<tr><td>${formatDate(e.date)}</td><td class="font-extrabold">${escapeHtml(e.category||'-')}</td><td class="text-red-600 font-extrabold">${formatCurrency(e.amount)}</td><td>${escapeHtml(getAccountName(e.accountId))}</td><td>${escapeHtml(e.note||'')}</td><td><button class="fee-action-chip red" onclick="deleteExpense('${e.id}')">حذف</button></td></tr>`).join("") || `<tr><td colspan="6" class="text-center text-slate-400 py-10">لا توجد مصاريف</td></tr>`}</tbody></table></div>
      </div>`;
  }

  function renderAccounts(el){
    normalizeMergedData();
    const accounts = state.data.paymentAccounts || [];
    const total = accounts.reduce((a,x)=> a + Number(x.balance||0),0);
    el.innerHTML = `
      <div class="space-y-5">${renderTopFeatureRibbon("accounts")}
        <div class="flex justify-between items-center gap-3 flex-wrap"><div><h2 class="text-2xl font-extrabold">حسابات الدفع والتحويل</h2><p class="text-sm text-slate-500 mt-1">أرصدة الكاش والبنوك والمحافظ وسجل الحركات</p></div><button onclick="showAccountModal()" class="btn bg-blue-600 text-white px-4 py-3 rounded-2xl font-extrabold"><i class="fas fa-plus"></i> حساب</button></div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3"><div class="fee-mini-stat"><small>عدد الحسابات</small><b>${accounts.length}</b></div><div class="fee-mini-stat"><small>إجمالي الأرصدة</small><b class="text-green-700">${formatCurrency(total)}</b></div><div class="fee-mini-stat"><small>آخر حركة</small><b>${escapeHtml((getAllAccountMovements()[0]?.label)||'-')}</b></div></div>
        <div class="grid sm:grid-cols-2 gap-3">${accounts.map(a=>`<div class="fee-card p-4"><div class="flex justify-between gap-3"><div><div class="font-extrabold text-lg">${escapeHtml(a.name)}</div><div class="text-xs text-slate-500 mt-1">${escapeHtml(a.type)} ${a.number?'- '+escapeHtml(a.number):''}</div></div><div class="text-left font-black text-xl text-green-700">${formatCurrency(a.balance)}</div></div><div class="mt-3 flex gap-2 flex-wrap"><button class="fee-action-chip green" onclick="showAccountMovementModal('${a.id}','deposit')">إيداع</button><button class="fee-action-chip red" onclick="showAccountMovementModal('${a.id}','withdraw')">سحب</button><button class="fee-action-chip blue" onclick="showAccountModal('${a.id}')">تعديل</button><button class="fee-action-chip red" onclick="deleteAccount('${a.id}')">حذف</button></div></div>`).join("") || `<div class="text-center text-slate-400 py-10 fee-card p-4 sm:col-span-2">لا توجد حسابات</div>`}</div>
        <div class="fee-table-wrap"><table class="table-modern min-w-[860px]"><thead><tr><th>التاريخ</th><th>الحساب</th><th>النوع</th><th>المبلغ</th><th>البيان</th></tr></thead><tbody>${getAllAccountMovements().map(m=>`<tr><td>${formatDate(m.date)}</td><td>${escapeHtml(m.accountName)}</td><td><span class="badge ${m.type==='deposit'?'badge-green':'badge-red'}">${m.type==='deposit'?'إيداع':'سحب'}</span></td><td>${formatCurrency(m.amount)}</td><td>${escapeHtml(m.label||'')}</td></tr>`).join("") || `<tr><td colspan="5" class="text-center text-slate-400 py-8">لا توجد حركات</td></tr>`}</tbody></table></div>
      </div>`;
  }

  function renderSupplierPayments(el){
    normalizeMergedData();
    const rows = [...(state.data.supplierPayments || [])].sort((a,b)=> new Date(b.date)-new Date(a.date));
    el.innerHTML = `<div class="space-y-5">${renderTopFeatureRibbon("supplierPayments")}<div class="flex justify-between items-center gap-3 flex-wrap"><div><h2 class="text-2xl font-extrabold">دفعات التجار</h2><p class="text-sm text-slate-500 mt-1">دفعات الموردين تخصم من حساب الدفع المختار</p></div><button onclick="showSupplierPaymentModal()" class="btn bg-blue-600 text-white px-4 py-3 rounded-2xl font-extrabold"><i class="fas fa-plus"></i> إضافة دفعة</button></div><div class="fee-table-wrap"><table class="table-modern min-w-[780px]"><thead><tr><th>التاريخ</th><th>التاجر</th><th>المبلغ</th><th>من حساب</th><th>ملاحظات</th><th>إجراءات</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${formatDate(r.date)}</td><td class="font-extrabold">${escapeHtml(r.supplierName)}</td><td class="text-red-600 font-extrabold">${formatCurrency(r.amount)}</td><td>${escapeHtml(getAccountName(r.accountId))}</td><td>${escapeHtml(r.note||'')}</td><td><button class="fee-action-chip red" onclick="deleteSupplierPayment('${r.id}')">حذف</button></td></tr>`).join("") || `<tr><td colspan="6" class="text-center text-slate-400 py-10">لا توجد دفعات</td></tr>`}</tbody></table></div></div>`;
  }

  function addProductToCart(productId){
    const p = (state.data.products || []).find(x => x.id === productId);
    if (!p) return;
    const found = cashierCart.find(x => x.productId === productId);
    if (found) found.qty = Number(found.qty || 0) + 1;
    else cashierCart.push({ productId:p.id, name:p.name, qty:1, price:Number(p.salePrice||0), costPrice:Number(p.costPrice||0) });
    render();
  }
  function setCartQty(i,v){ if(cashierCart[i]) cashierCart[i].qty = Math.max(0, parseNumber(v)); render(); }

  function completeCashierSale(){
    normalizeMergedData();
    if(!cashierCart.length){ showToast("السلة فارغة", "error"); return; }
    const subtotal = cashierCart.reduce((a,l)=> a + Number(l.qty||0)*Number(l.price||0),0);
    const discount = parseNumber($("fee-cashier-discount")?.value || 0);
    const total = Math.max(0, subtotal - discount);
    const paid = Math.min(total, parseNumber($("fee-cashier-paid")?.value || total));
    const customer = getOrCreateCustomerByName($("fee-cashier-customer")?.value || "زبون كاش");
    const items = cashierCart.map(l=>({ productId:l.productId || "", name:l.name, qty:Number(l.qty||0), price:Number(l.price||0), costPrice:Number(l.costPrice||0), total:Number(l.qty||0)*Number(l.price||0) }));
    items.forEach(it=>{ const p=(state.data.products||[]).find(x=>x.id===it.productId); if(p) p.stock = Number(p.stock||0) - Number(it.qty||0); });
    const invoice = { id: uid("inv"), invoiceNumber: getNextInvoiceNumber(), customerId: customer.id, date:new Date().toISOString(), items, subtotal, discount, paidAmount:paid, note:"فاتورة كاشير", status: total-paid > 0 ? "pending" : "completed", source:"cashier", createdAt:new Date().toISOString(), createdBy: state.session.userId };
    state.data.invoices.push(invoice);
    const accountId = $("fee-cashier-account")?.value || "";
    if(accountId && paid > 0) addAccountMovement(accountId, "deposit", paid, `بيع فاتورة ${invoice.invoiceNumber}`, invoice.id);
    enqueueSyncOperation({ type:"add_cashier_invoice", payload:{ invoiceId:invoice.id, invoiceNumber: invoice.invoiceNumber } });
    cashierCart = [];
    saveAppState();
    render();
    showToast("تم حفظ فاتورة الكاشير", "success");
    if(!isLocalOnlyMode() && navigator.onLine) syncQueueToCloud();
  }

    const rows = $$("#invoice-items-wrap > .grid");

    const customerName=$("invoice-customer-name")?.value?.trim(); if(!customerName){showToast("أدخل اسم العميل","error"); return;}
    let customer = getCustomerById($("invoice-customer-id")?.value||"");
    if(!customer){ customer = getOrCreateCustomerByName(customerName, $("invoice-customer-phone")?.value?.trim()||""); }
    else { customer.name = customerName; if($("invoice-customer-phone")?.value?.trim()) customer.phone = $("invoice-customer-phone").value.trim(); }
    const oldProductQty = {};

  function mergeArrayByIdentity(current=[], incoming=[]){
    const out = [...current];
    const keyOf = (x) => x.id || x.invoiceNumber || x.barcode || x.code || x.name || JSON.stringify(x);
    incoming.forEach(item=>{
      const k=keyOf(item); const idx=out.findIndex(x=>keyOf(x)===k);
      if(idx>=0){
        const merged = { ...out[idx], ...item };
        ["payments","manualDebts","movements","items"].forEach(key=>{ if(Array.isArray(out[idx][key]) || Array.isArray(item[key])) merged[key] = mergeArrayByIdentity(out[idx][key]||[], item[key]||[]); });
        out[idx]=merged;
      } else out.push(item);
    });
    return out;
  }

<script id="fee-pro-fix-script">
(function(){
  "use strict";
  const $ = (id) => document.getElementById(id);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  let cart = [];
  let suppressRenderCleanup = false;

  function esc(v){ return escapeHtml(v == null ? "" : String(v)); }

  function arr(name){ if(!Array.isArray(state.data[name])) state.data[name] = []; return state.data[name]; }

  function normalizeProData(){
    ["products","expenses","paymentAccounts","supplierPayments","suppliers","workers","wages","shortages","currencies","accountMovements"].forEach(arr);
    if(!state.data.meta || typeof state.data.meta !== "object") state.data.meta = {};
    if(!state.data.settings) state.data.settings = {};
    state.data.settings.currency = state.data.settings.currency || "شيكل";
    if(!state.data.currencies.length){
      state.data.currencies.push({ id:"cur_ils", code:"ILS", name:"شيكل", symbol:"₪", rateToBase:1, isBase:true, createdAt:nowISO() });
    }
    if(!state.data.currencies.some(c => c.isBase)) state.data.currencies[0].isBase = true;
    state.data.currencies = state.data.currencies.map(c => ({
      id: c.id || uid("cur"),
      code: String(c.code || c.symbol || c.name || "ILS").toUpperCase(),
      name: c.name || c.code || "عملة",
      symbol: c.symbol || c.name || c.code || "₪",
      rateToBase: Number(c.rateToBase || c.rate || 1) || 1,
      isBase: !!c.isBase,
      createdAt: c.createdAt || nowISO()
    }));
    state.data.products = arr("products").map(p => {
      const unitType = p.unitType || (String(p.unit||"").includes("كرت") ? "carton" : String(p.unit||"").includes("كيل") ? "kg" : String(p.unit||"").includes("لتر") ? "liter" : "piece");
      const pieces = Math.max(1, Number(p.piecesPerCarton || p.cartonSize || 1) || 1);
      let stock = Number(p.stockBase ?? p.stock ?? 0) || 0;
      if(unitType === "carton" && p.stockBase == null && p.stockCartons != null) stock = Number(p.stockCartons || 0) * pieces;
      const saleCurrency = p.saleCurrency || p.currency || getBaseCurrency().code;
      const costCurrency = p.costCurrency || p.currency || getBaseCurrency().code;
      return {
        ...p,
        id: p.id || uid("prod"),
        name: p.name || "صنف بدون اسم",
        category: p.category || "عام",
        code: p.code || p.barcode || "",
        barcode: p.barcode || p.code || "",
        unitType,
        unit: unitLabel(unitType),
        piecesPerCarton: pieces,
        stock,
        lowStock: Number(p.lowStock ?? 0),
        costPrice: Number(p.costPrice ?? p.cost ?? 0) || 0,
        salePrice: Number(p.salePrice ?? p.price ?? 0) || 0,
        costCurrency,
        saleCurrency,
        updatedAt: p.updatedAt || p.createdAt || nowISO(),
        createdAt: p.createdAt || nowISO()
      };
    });
    state.data.paymentAccounts = arr("paymentAccounts").map(a => ({
      id: a.id || uid("acc"),
      name: a.name || "حساب دفع",
      type: a.type || "cash",
      number: a.number || "",
      currency: a.currency || getBaseCurrency().code,
      balance: Number(a.balance || 0) || 0,
      movements: Array.isArray(a.movements) ? a.movements : [],
      createdAt: a.createdAt || nowISO(),
      updatedAt: a.updatedAt || a.createdAt || nowISO()
    }));
    state.data.expenses = arr("expenses").map(e => ({...e, id:e.id||uid("exp"), amount:Number(e.amount||0)||0, currency:e.currency||getBaseCurrency().code, date:e.date||nowISO(), type:e.type||"expense"}));
    state.data.wages = arr("wages").map(w => ({...w, id:w.id||uid("wage"), amount:Number(w.amount||0)||0, currency:w.currency||getBaseCurrency().code, date:w.date||nowISO()}));
    state.data.purchases = arr("purchases").map(p => ({...p, id:p.id||uid("pur"), amount:Number(p.amount ?? p.price ?? p.total ?? 0)||0, paidAmount:Number(p.paidAmount ?? p.paid ?? p.amount ?? 0)||0, currency:p.currency||getBaseCurrency().code, date:p.date||nowISO()}));
    refreshShortages(false);
  }

  function unitLabel(type){ return type === "carton" ? "كرتونة" : type === "kg" ? "كيلو" : type === "liter" ? "لتر" : "قطعة"; }
  function baseUnitLabel(p){ return p.unitType === "carton" || p.unitType === "piece" ? "قطعة" : unitLabel(p.unitType); }
  function getBaseCurrency(){ normalizeCurrencyOnly(); return state.data.currencies.find(c=>c.isBase) || state.data.currencies[0] || {code:"ILS",name:"شيكل",symbol:"₪",rateToBase:1,isBase:true}; }
  function normalizeCurrencyOnly(){ if(!Array.isArray(state.data.currencies)) state.data.currencies=[]; if(!state.data.currencies.length) state.data.currencies.push({id:"cur_ils",code:"ILS",name:"شيكل",symbol:"₪",rateToBase:1,isBase:true}); }
  function getCurrency(code){ normalizeCurrencyOnly(); return state.data.currencies.find(c => c.code === code) || getBaseCurrency(); }
  function currencyOptions(selected){ normalizeCurrencyOnly(); return state.data.currencies.map(c=>`<option value="${esc(c.code)}" ${selected===c.code?'selected':''}>${esc(c.name)} (${esc(c.symbol)})</option>`).join(""); }
  function toBase(amount, code){ const c = getCurrency(code); return Number(amount||0) * (Number(c.rateToBase||1)||1); }
  function money(amount, code){ const c = getCurrency(code); return `${Number(amount||0).toLocaleString('en-US',{maximumFractionDigits:3})} ${esc(c.symbol || c.name || c.code)}`; }
  function baseMoney(amount){ return formatCurrency(Number(amount||0)); }

  function productStockText(p){
    const stock = Number(p.stock||0);
    if(p.unitType === "carton"){
      const size = Math.max(1, Number(p.piecesPerCarton||1));
      const cartons = Math.floor(stock / size);
      const pieces = +(stock - cartons * size).toFixed(3);
      return pieces ? `${cartons} كرتونة + ${pieces} قطعة` : `${cartons} كرتونة`;
    }
    return `${Number(stock.toFixed(3))} ${baseUnitLabel(p)}`;
  }
  function productUnitChoices(p){
    if(p.unitType === "carton") return [{key:"piece",label:"قطعة"},{key:"carton",label:"كرتونة"}];
    if(p.unitType === "kg") return [{key:"kg",label:"كيلو"}];
    if(p.unitType === "liter") return [{key:"liter",label:"لتر"}];
    return [{key:"piece",label:"قطعة"}];
  }
  function getUnitPrice(p, unitKey){
    if(p.unitType === "carton"){
      const pieces = Math.max(1, Number(p.piecesPerCarton||1));
      if(unitKey === "piece") return Number(p.salePricePiece ?? (Number(p.salePrice||0) / pieces));
      return Number(p.salePriceCarton ?? p.salePrice ?? (Number(p.salePricePiece||0) * pieces));
    }
    return Number(p.salePrice||0);
  }
  function getUnitCost(p, unitKey){
    if(p.unitType === "carton" && unitKey === "piece") return Number(p.costPrice||0) / Math.max(1, Number(p.piecesPerCarton||1));
    return Number(p.costPrice||0);
  }
  function qtyToStockDeduction(p, qty, unitKey){
    if(p.unitType === "carton" && unitKey === "carton") return Number(qty||0) * Math.max(1, Number(p.piecesPerCarton||1));
    return Number(qty||0);
  }

  function proCalculateInvoiceTotals(invoice){
    const subtotal = Number(invoice?.subtotalBase ?? invoice?.subtotal ?? 0) || 0;
    const discount = Number(invoice?.discountBase ?? invoice?.discount ?? 0) || 0;
    const total = Math.max(0, subtotal - discount);
    const paid = Number(invoice?.paidBase ?? invoice?.paidAmount ?? 0) || 0;
    const remaining = Math.max(0, total - paid);
    return { subtotal, discount, total, paid, remaining };
  }
  window.calculateInvoiceTotals = proCalculateInvoiceTotals;

  function rebuildAllBalances(){
    (state.data.customers||[]).forEach(c => {
      const invoices = (state.data.invoices||[]).filter(i=>i.customerId===c.id).reduce((a,i)=>a+proCalculateInvoiceTotals(i).remaining,0);
      const manual = (c.manualDebts||[]).reduce((a,d)=>a+toBase(d.amount||0, d.currency||getBaseCurrency().code),0);
      const payments = (c.payments||[]).reduce((a,p)=>a+toBase(p.amount||0, p.currency||getBaseCurrency().code),0);
      c.balance = Math.max(0, invoices + manual - payments);
    });
  }
  window.rebuildCustomerBalances = rebuildAllBalances;

  function syncAndSave(type, payload={}, rerender=true){
    normalizeProData();
    rebuildAllBalances();
    enqueueSyncOperation({type, payload});
    saveAppState();
    updatePendingSyncBadge();
    updateAlertsBadge();
    if(rerender) render();
    if(!isLocalOnlyMode() && navigator.onLine) syncQueueToCloud();
  }

  let __feeDownloadSerial = 0;
  function makeUniqueDownloadName(filename){
    const raw = String(filename || 'download.bin').replace(/[\/:*?"<>|]+/g, '_').trim() || 'download.bin';
    const dot = raw.lastIndexOf('.');
    const stamp = new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14) + '_' + (++__feeDownloadSerial);
    return dot > 0 ? raw.slice(0,dot) + '_' + stamp + raw.slice(dot) : raw + '_' + stamp;
  }
  function robustDownloadBlob(blob, filename){
    try{
      if(!(blob instanceof Blob) || !blob.size){
        throw new Error('Empty download blob');
      }
      const safeName = makeUniqueDownloadName(filename);
      let fileBlob = blob;
      try { fileBlob = new File([blob], safeName, { type: blob.type || 'application/octet-stream' }); } catch(e) {}
      const url = URL.createObjectURL(fileBlob);
      const a = document.createElement("a");
      a.href = url;
      a.download = safeName;
      a.rel = "noopener";
      a.style.cssText = "position:fixed;left:-99999px;top:-99999px;width:1px;height:1px;opacity:0;pointer-events:none";
      document.body.appendChild(a);
      a.click();
      setTimeout(()=>{ try{ a.remove(); }catch(e){} }, 1500);
      setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 60000);
      return true;
    }catch(err){
      console.error(err);
      try{
        const reader = new FileReader();
        reader.onload = function(){
          const opened = window.open(reader.result, "_blank");
          if(!opened) showToast('المتصفح منع التنزيل، اسمح بالنوافذ المنبثقة أو جرّب مرة ثانية', 'warning');
        };
        reader.readAsDataURL(blob);
      }catch(e){}
      return false;
    }
  }
  function canvasToBlob(canvas, type="image/png", quality=.92){
    return new Promise(resolve => {
      if(canvas.toBlob) canvas.toBlob(b=>resolve(b), type, quality);
      else {
        const bin = atob(canvas.toDataURL(type, quality).split(',')[1]);
        const arr = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
        resolve(new Blob([arr], {type}));
      }
    });
  }
  function toBWCanvas(canvas){
    try{
      const out = document.createElement('canvas'); out.width = canvas.width; out.height = canvas.height;
      const ctx = out.getContext('2d'); ctx.drawImage(canvas,0,0);
      const img = ctx.getImageData(0,0,out.width,out.height);
      for(let i=0;i<img.data.length;i+=4){
        const gray = img.data[i]*.299 + img.data[i+1]*.587 + img.data[i+2]*.114;
        const v = gray > 168 ? 255 : 0;
        img.data[i]=img.data[i+1]=img.data[i+2]=v;
      }
      ctx.putImageData(img,0,0);
      return out;
    }catch(e){ console.warn(e); return canvas; }
  }
  async function renderElementToCanvas(html, opts={}){
    const root = $('capture-root') || document.body.appendChild(document.createElement('div'));
    root.innerHTML = html;
    const el = root.firstElementChild;
    if(!el) throw new Error('لا يوجد محتوى للتصدير');
    await Promise.all(Array.from(el.querySelectorAll('img')).map(img => new Promise(res => { img.crossOrigin = 'anonymous'; if(img.complete) res(); else { img.onload=img.onerror=res; } })));
    const canvas = await html2canvas(el, { scale: opts.scale || 2, backgroundColor:'#ffffff', useCORS:true, allowTaint:false, logging:false });
    root.innerHTML = '';
    return opts.bw ? toBWCanvas(canvas) : canvas;
  }
  function logoHTML(cls="fee-report-logo"){
    const logo = state.data.settings.logo || "";

  }

  function buildThermalInvoiceHTML(invoiceId){
    const inv = getInvoiceById(invoiceId); if(!inv) return '';
    const customer = getCustomerById(inv.customerId) || {};
    const t = proCalculateInvoiceTotals(inv);
    const s = state.data.settings || {};
    const rows = (inv.items||[]).map(it => `<tr><td>${esc(it.name||'-')}<div style="font-size:9px">${esc(it.unitLabel||it.unit||'')}</div></td><td>${Number(it.qty||0)}</td><td>${baseMoney(it.priceBase ?? toBase(it.price||0,it.currency||inv.currency||getBaseCurrency().code))}</td><td>${baseMoney(it.totalBase ?? toBase(it.total||0,it.currency||inv.currency||getBaseCurrency().code))}</td></tr>`).join('');
    return `<div class="fee-thermal-paper">
      ${s.logo ? `<img crossorigin="anonymous" src="${esc(s.logo)}" class="fee-thermal-logo">` : ''}

  function createCashierInvoicePro({mode='cash', customerName='', customerPhone='', customerId='', paidValue=null, note='' } = {}){
    normalizeProData();
    if(!cart.length){ showToast('السلة فارغة','error'); return null; }
    const totals = cartTotals();
    let paidBase = Number(totals.paidBase || 0);
    const currency = $('fee-cashier-currency')?.value || getBaseCurrency().code;
    if(paidValue !== null && paidValue !== undefined && paidValue !== '') paidBase = Math.min(totals.totalBase, toBase(num(paidValue), currency));
    if(mode === 'cash' || mode === 'app') paidBase = totals.totalBase;
    if(mode === 'debt' || mode === 'app_debt') paidBase = Math.min(totals.totalBase, paidBase || 0);
    const remainingBase = Math.max(0, totals.totalBase - paidBase);
    const fallbackName = mode === 'cash' ? (($('fee-cashier-customer')?.value || 'زبون كاش').trim() || 'زبون كاش') : (customerName || '').trim();
    if((mode === 'debt' || mode === 'app' || mode === 'app_debt') && !fallbackName){ showToast('أدخل اسم العميل','error'); return null; }
    const customer = findOrCreateCustomerForCashierPro(fallbackName || 'زبون كاش', customerPhone || '', customerId || ($('fee-cashier-customer-id')?.value || ''));
    const items = buildCashierInvoiceItemsPro();
    items.forEach(it=>{ const p=arr('products').find(x=>x.id===it.productId); if(p) p.stock = Number(p.stock||0) - Number(it.stockDeduct||0); });
    const paymentLabel = mode === 'cash' ? 'كاش' : mode === 'app' ? 'تطبيق فوري' : mode === 'app_debt' ? 'تطبيق دين' : 'دين';
    const invoice = {id:uid('inv'),invoiceNumber:getNextInvoiceNumber(),customerId:customer.id,date:nowISO(),items,subtotalBase:totals.subtotalBase,subtotal:totals.subtotalBase,discount:totals.discount,discountBase:totals.discountBase,paidAmount:paidBase,paidBase,currency:getBaseCurrency().code,note:note || paymentLabel,paymentMethod:mode,paymentLabel,status:remainingBase>0?'pending':'completed',source:'cashier',createdAt:nowISO(),createdBy:state.session.userId};

  function inPeriod(dateStr, f){ const d=new Date(dateStr); if(f.from){const from=new Date(f.from+'T00:00:00'); if(d<from)return false;} if(f.to){const to=new Date(f.to+'T23:59:59'); if(d>to)return false;} return true; }
  function getReportsDataPro(){ normalizeProData(); rebuildAllBalances(); const f=collectPeriod(); const invoices=arr('invoices').filter(i=>inPeriod(i.date,f)); const sales=invoices.reduce((a,i)=>a+proCalculateInvoiceTotals(i).total,0); const paid=invoices.reduce((a,i)=>a+proCalculateInvoiceTotals(i).paid,0); const remaining=invoices.reduce((a,i)=>a+proCalculateInvoiceTotals(i).remaining,0); const discounts=invoices.reduce((a,i)=>a+proCalculateInvoiceTotals(i).discount,0); const cogs=invoices.flatMap(i=>i.items||[]).reduce((a,it)=>a+Number(it.costBase ?? toBase(Number(it.costPrice||0)*Number(it.qty||0),it.costCurrency||it.currency||getBaseCurrency().code)),0); const expenses=arr('expenses').filter(e=>e.type!=='wage'&&inPeriod(e.date,f)).reduce((a,e)=>a+toBase(e.amount,e.currency),0); const wages=arr('wages').filter(w=>inPeriod(w.date,f)).reduce((a,w)=>a+toBase(w.amount,w.currency),0); const purchases=arr('purchases').filter(p=>inPeriod(p.date,f)).reduce((a,p)=>a+toBase(p.amount,p.currency),0); const gross=sales-cogs; const net=gross-expenses-wages-purchases; const accountIn=allMovements().filter(m=>m.type==='deposit'&&inPeriod(m.date,f)).reduce((a,m)=>a+Number(m.baseAmount??toBase(m.amount,m.currency)),0); const accountOut=allMovements().filter(m=>m.type!=='deposit'&&inPeriod(m.date,f)).reduce((a,m)=>a+Number(m.baseAmount??toBase(m.amount,m.currency)),0); const customerMap={}; invoices.forEach(inv=>{const c=getCustomerById(inv.customerId)||{}; const key=inv.customerId||'unknown'; if(!customerMap[key]) customerMap[key]={customerName:c.name||'عميل غير معروف',invoiceCount:0,total:0,paid:0,remaining:0}; const t=proCalculateInvoiceTotals(inv); customerMap[key].invoiceCount++; customerMap[key].total+=t.total; customerMap[key].paid+=t.paid; customerMap[key].remaining+=t.remaining;}); const itemMap={}; invoices.forEach(inv=>(inv.items||[]).forEach(it=>{const k=it.name||'غير محدد'; if(!itemMap[k]) itemMap[k]={itemName:k,qty:0,sales:0,cost:0,profit:0,invoiceCount:0}; itemMap[k].qty+=Number(it.qty||0); itemMap[k].sales+=Number(it.totalBase??toBase(it.total||0,it.currency)); itemMap[k].cost+=Number(it.costBase||0); itemMap[k].profit=itemMap[k].sales-itemMap[k].cost; itemMap[k].invoiceCount++;})); return {filters:f,filteredInvoices:invoices,totalInvoices:invoices.length,totalCustomers:arr('customers').length,totalSales:sales,totalPaid:paid,totalRemaining:remaining,totalDiscount:discounts,totalCost:cogs,grossProfit:gross,expenses,wages,totalPurchases:purchases,netProfit:net,accountIn,accountOut,customerRows:Object.values(customerMap).sort((a,b)=>b.remaining-a.remaining),itemRows:Object.values(itemMap).sort((a,b)=>b.sales-a.sales),shortages:getShortageProducts()}; }
  window.getReportsData = getReportsDataPro;

  function reportExportHTML(){ const d=getReportsDataPro(); const s=state.data.settings; return `<div class="fee-report-export" id="reports-export-area"><div class="fee-report-header"><div style="display:flex;gap:14px;align-items:center">${logoHTML('fee-report-logo')}<div><div class="fee-report-title">${esc(s.shopName||s.companyName||'التقارير')}</div><div class="fee-report-sub">تقرير المبيعات والأرباح والحسابات<br>${esc(formatDate(nowISO()))}</div></div></div><div class="fee-report-sub">${s.shopPhone?`هاتف: ${esc(s.shopPhone)}<br>`:''}${s.shopAddress?`العنوان: ${esc(s.shopAddress)}`:''}</div></div><div class="grid grid-cols-2 sm:grid-cols-4 gap-3"><div class="fee-mini-stat"><small>المبيعات</small><b>${baseMoney(d.totalSales)}</b></div><div class="fee-mini-stat"><small>تكلفة البضاعة</small><b>${baseMoney(d.totalCost)}</b></div><div class="fee-mini-stat"><small>إجمالي الربح</small><b class="text-green-700">${baseMoney(d.grossProfit)}</b></div><div class="fee-mini-stat"><small>صافي الربح</small><b class="${d.netProfit>=0?'text-green-700':'text-red-600'}">${baseMoney(d.netProfit)}</b></div><div class="fee-mini-stat"><small>المصاريف</small><b class="text-red-600">${baseMoney(d.expenses)}</b></div><div class="fee-mini-stat"><small>أجور العمال</small><b class="text-red-600">${baseMoney(d.wages)}</b></div><div class="fee-mini-stat"><small>المشتريات</small><b class="text-red-600">${baseMoney(d.totalPurchases)}</b></div><div class="fee-mini-stat"><small>ديون الزبائن</small><b class="text-red-600">${baseMoney(d.totalRemaining)}</b></div><div class="fee-mini-stat"><small>وارد الحسابات</small><b class="text-green-700">${baseMoney(d.accountIn)}</b></div><div class="fee-mini-stat"><small>صادر الحسابات</small><b class="text-red-600">${baseMoney(d.accountOut)}</b></div></div><div class="section-card p-4 mt-4"><h3 class="font-extrabold mb-3">تقرير الزبائن</h3><table class="fee-lite-table"><thead><tr><th>الزبون</th><th>الفواتير</th><th>الإجمالي</th><th>الواصل</th><th>المتبقي</th></tr></thead><tbody>${d.customerRows.map(r=>`<tr><td>${esc(r.customerName)}</td><td>${r.invoiceCount}</td><td>${baseMoney(r.total)}</td><td>${baseMoney(r.paid)}</td><td>${baseMoney(r.remaining)}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد بيانات</td></tr>'}</tbody></table></div><div class="section-card p-4 mt-4"><h3 class="font-extrabold mb-3">تقرير الأصناف والأرباح</h3><table class="fee-lite-table"><thead><tr><th>الصنف</th><th>الكمية</th><th>المبيعات</th><th>التكلفة</th><th>الربح</th></tr></thead><tbody>${d.itemRows.map(r=>`<tr><td>${esc(r.itemName)}</td><td>${Number(r.qty.toFixed(3))}</td><td>${baseMoney(r.sales)}</td><td>${baseMoney(r.cost)}</td><td>${baseMoney(r.profit)}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد بيانات</td></tr>'}</tbody></table></div><div class="section-card p-4 mt-4"><h3 class="font-extrabold mb-3">البضاعة الناقصة</h3><table class="fee-lite-table"><thead><tr><th>الصنف</th><th>المخزون</th><th>حد النقص</th></tr></thead><tbody>${d.shortages.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(productStockText(p))}</td><td>${p.lowStock||0}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد بضاعة ناقصة</td></tr>'}</tbody></table></div></div>`; }
  function renderReportsPro(el){ const saved=getSavedReportFilters ? getSavedReportFilters() : {}; el.innerHTML=`<div class="space-y-5"><div><h2 class="text-2xl font-extrabold">التقارير</h2><p class="text-sm text-slate-500">نفس الحسابات السابقة مع الأرباح والمصاريف والأجور والمشتريات والحسابات</p></div><div class="section-card p-4"><div class="fee-two-grid"><div><label class="block text-sm font-bold mb-2">من تاريخ</label><input id="report-filter-from" type="date" class="input" value="${esc(saved.from||'')}"></div><div><label class="block text-sm font-bold mb-2">إلى تاريخ</label><input id="report-filter-to" type="date" class="input" value="${esc(saved.to||'')}"></div></div><div class="flex gap-2 flex-wrap mt-4"><button onclick="render()" class="btn bg-blue-600 text-white px-4 py-3 rounded-2xl font-bold">تحديث</button><button onclick="exportReportsImage()" class="btn bg-green-600 text-white px-4 py-3 rounded-2xl font-bold">صورة</button><button onclick="exportReportsPDF()" class="btn bg-red-600 text-white px-4 py-3 rounded-2xl font-bold">PDF</button><button onclick="exportReportsExcel()" class="btn bg-emerald-600 text-white px-4 py-3 rounded-2xl font-bold">Excel</button><button onclick="exportReportsWord()" class="btn bg-indigo-600 text-white px-4 py-3 rounded-2xl font-bold">Word</button></div></div><div id="reports-content-wrap">${reportExportHTML()}</div></div>`; }
  window.exportReportsImage = async function(){ try{ const html=reportExportHTML(); const canvas=await renderElementToCanvas(html,{scale:2}); const blob=await canvasToBlob(canvas,'image/png'); robustDownloadBlob(blob,'reports.png') ? showToast('تم تنزيل التقرير صورة','success') : showToast('تعذر تنزيل الصورة','error'); }catch(err){console.error(err);showToast('تعذر تنزيل التقرير صورة','error');} };
  window.exportReportsPDF = async function(){ try{ const canvas=await renderElementToCanvas(reportExportHTML(),{scale:2}); const img=canvas.toDataURL('image/png'); const {jsPDF}=window.jspdf; const pdf=new jsPDF('p','mm','a4'); const pageHeight=297,imgWidth=190,imgHeight=canvas.height*imgWidth/canvas.width; let heightLeft=imgHeight,pos=10; pdf.addImage(img,'PNG',10,pos,imgWidth,imgHeight); heightLeft-=277; while(heightLeft>0){pos=heightLeft-imgHeight+10; pdf.addPage(); pdf.addImage(img,'PNG',10,pos,imgWidth,imgHeight); heightLeft-=277;} robustDownloadBlob(pdf.output('blob'),'reports.pdf') ? showToast('تم تنزيل التقرير PDF','success') : showToast('تعذر تنزيل PDF','error'); }catch(err){console.error(err);showToast('تعذر تنزيل PDF','error');} };
  window.exportReportsExcel = function(){ try{ const d=getReportsDataPro(); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['اسم المحل',state.data.settings.shopName||state.data.settings.companyName||''],['إجمالي المبيعات',d.totalSales],['تكلفة البضاعة',d.totalCost],['إجمالي الربح',d.grossProfit],['المصاريف',d.expenses],['أجور العمال',d.wages],['المشتريات',d.totalPurchases],['صافي الربح',d.netProfit],['وارد الحسابات',d.accountIn],['صادر الحسابات',d.accountOut],['ديون الزبائن',d.totalRemaining]]),'ملخص'); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['الزبون','عدد الفواتير','الإجمالي','الواصل','المتبقي'],...d.customerRows.map(r=>[r.customerName,r.invoiceCount,r.total,r.paid,r.remaining])]),'الزبائن'); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['الصنف','الكمية','المبيعات','التكلفة','الربح'],...d.itemRows.map(r=>[r.itemName,r.qty,r.sales,r.cost,r.profit])]),'الأصناف'); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['الصنف','المخزون','حد النقص'],...d.shortages.map(p=>[p.name,productStockText(p),p.lowStock])]),'البضاعة الناقصة'); const out=XLSX.write(wb,{bookType:'xlsx',type:'array'}); robustDownloadBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'reports.xlsx'); showToast('تم تنزيل Excel','success'); }catch(err){console.error(err);showToast('تعذر تنزيل Excel','error');} };
  window.exportReportsWord = function(){ try{ const html=`<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"></head><body>${reportExportHTML()}</body></html>`; robustDownloadBlob(new Blob(['\ufeff',html],{type:'application/msword;charset=utf-8'}),'reports.doc'); showToast('تم تنزيل Word','success'); }catch(err){console.error(err);showToast('تعذر تنزيل Word','error');} };

  window.saveInvoiceStatusChange = function(invoiceId){ const inv=getInvoiceById(invoiceId); if(!inv)return; const newStatus=$('invoice-status-change')?.value||'pending'; if(newStatus==='completed'){ const t=proCalculateInvoiceTotals(inv); inv.paidAmount=t.total; inv.paidBase=t.total; inv.status='completed'; } else inv.status=newStatus; inv.updatedAt=nowISO(); closeModal(); syncAndSave('change_invoice_status',{invoiceId,status:inv.status}); showToast(newStatus==='completed'?'تم تحويل الفاتورة لمكتملة وخصمها من الدين':'تم تحديث حالة الفاتورة','success'); };

  function buildAllCustomerInvoicesHTMLPro(){ rebuildAllBalances(); const rows=arr('customers').filter(c=>Number(c.balance||0)>0).sort((a,b)=>Number(b.balance||0)-Number(a.balance||0)); const total=rows.reduce((a,c)=>a+Number(c.balance||0),0); return `<div class="fee-report-export"><div class="fee-report-header"><div style="display:flex;gap:14px;align-items:center">${logoHTML('fee-report-logo')}<div><div class="fee-report-title">${esc(state.data.settings.shopName||state.data.settings.companyName||'')}</div><div class="fee-report-sub">كشف عام بديون الزبائن<br>${formatDate(nowISO())}</div></div></div><div class="font-extrabold text-red-600">${baseMoney(total)}</div></div><table class="fee-lite-table"><thead><tr><th>الزبون</th><th>الهاتف</th><th>المبلغ المطلوب</th></tr></thead><tbody>${rows.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone||'-')}</td><td>${baseMoney(c.balance)}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد ديون</td></tr>'}</tbody><tfoot><tr><td colspan="2"><b>الإجمالي</b></td><td><b>${baseMoney(total)}</b></td></tr></tfoot></table></div>`; }
  window.downloadAllCustomerInvoicesPDF = async function(){ try{ const canvas=await renderElementToCanvas(buildAllCustomerInvoicesHTMLPro(),{scale:2}); const {jsPDF}=window.jspdf; const img=canvas.toDataURL('image/png'); const pdf=new jsPDF('p','mm','a4'); const w=190,h=canvas.height*w/canvas.width; pdf.addImage(img,'PNG',10,10,w,h); robustDownloadBlob(pdf.output('blob'),'all_customer_debts.pdf'); showToast('تم تنزيل كشف الديون PDF','success'); }catch(e){console.error(e);showToast('تعذر تنزيل كشف الديون','error');} };
  window.downloadAllCustomerInvoicesExcel = function(){ rebuildAllBalances(); const rows=[['الزبون','الهاتف','إجمالي الدين'],...arr('customers').filter(c=>Number(c.balance||0)>0).map(c=>[c.name,c.phone||'',Number(c.balance||0)])]; const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'ديون الزبائن'); const out=XLSX.write(wb,{bookType:'xlsx',type:'array'}); robustDownloadBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'all_customer_debts.xlsx'); showToast('تم تنزيل كشف الديون Excel','success'); };

  function appendSettingsPro(){ if($('fee-pro-settings-card'))return; const container=$('app-container'); if(!container)return; normalizeProData(); const div=document.createElement('div'); div.id='fee-pro-settings-card'; div.className='section-card p-4 mt-5'; div.innerHTML=`<div class="flex justify-between items-center gap-3 flex-wrap"><div><h3 class="text-xl font-extrabold">العملات وسعر الصرف</h3><p class="text-sm text-slate-500 mt-1">الأساسية شيكل، ويمكن البيع والإضافة والتصدير بعملة مختلفة مع تحويلها للتقارير</p></div><button onclick="showCurrencyModalPro()" class="btn bg-blue-600 text-white px-4 py-3 rounded-2xl font-extrabold"><i class="fas fa-plus"></i> عملة</button></div><div class="fee-table-wrap mt-4"><table class="table-modern"><thead><tr><th>العملة</th><th>الرمز</th><th>سعر الصرف مقابل الشيكل</th><th>أساسية</th><th>إجراءات</th></tr></thead><tbody>${arr('currencies').map(c=>`<tr><td class="font-extrabold">${esc(c.name)} (${esc(c.code)})</td><td>${esc(c.symbol)}</td><td>${c.rateToBase}</td><td>${c.isBase?'نعم':'-'}</td><td><button class="fee-action-chip blue" onclick="showCurrencyModalPro('${c.id}')">تعديل</button>${c.isBase?'':`<button class="fee-action-chip red" onclick="deleteCurrencyPro('${c.id}')">حذف</button>`}</td></tr>`).join('')}</tbody></table></div>`; container.appendChild(div); }
  window.showCurrencyModalPro = function(id=''){ normalizeProData(); const c=arr('currencies').find(x=>x.id===id)||{}; openModal({title:id?'تعديل عملة':'إضافة عملة',maxWidth:'560px',body:`<div class="fee-two-grid"><input id="cur-id" type="hidden" value="${esc(id)}"><div><label class="block text-sm font-bold mb-2">اسم العملة</label><input id="cur-name" class="input" value="${esc(c.name||'')}"></div><div><label class="block text-sm font-bold mb-2">الكود</label><input id="cur-code" class="input" value="${esc(c.code||'')}"></div><div><label class="block text-sm font-bold mb-2">الرمز</label><input id="cur-symbol" class="input" value="${esc(c.symbol||'')}"></div><div><label class="block text-sm font-bold mb-2">سعر الصرف مقابل الشيكل</label><input id="cur-rate" class="input" type="number" step="0.0001" value="${c.rateToBase??1}"></div></div>`,footer:`<div class="flex gap-2"><button onclick="closeModal()" class="btn flex-1 py-3 rounded-2xl bg-slate-100 font-bold">إلغاء</button><button onclick="saveCurrencyPro()" class="btn flex-1 py-3 rounded-2xl bg-blue-600 text-white font-extrabold">حفظ</button></div>`}); };
  window.saveCurrencyPro = function(){ const id=$('cur-id')?.value||''; const name=$('cur-name')?.value?.trim(); const code=($('cur-code')?.value?.trim()||'').toUpperCase(); if(!name||!code){showToast('أدخل اسم وكود العملة','error');return;} const payload={id:id||uid('cur'),name,code,symbol:$('cur-symbol')?.value?.trim()||code,rateToBase:num($('cur-rate')?.value)||1,isBase:id?(arr('currencies').find(c=>c.id===id)?.isBase||false):false,updatedAt:nowISO()}; const i=arr('currencies').findIndex(c=>c.id===id); if(i>=0) state.data.currencies[i]={...state.data.currencies[i],...payload}; else state.data.currencies.push({...payload,createdAt:nowISO()}); closeModal(); syncAndSave(i>=0?'edit_currency':'add_currency',{id:payload.id}); };
  window.deleteCurrencyPro = function(id){ confirmDialog({title:'حذف العملة',message:'هل تريد حذف العملة؟',confirmText:'حذف',onConfirm:()=>{state.data.currencies=arr('currencies').filter(c=>c.id!==id); syncAndSave('delete_currency',{id});}}); };

  const previousRender = window.render;
  window.render = function(){
    normalizeProData(); ensureSideMenu();
    const container=$('app-container');
    const custom={cashier:renderCashierPro,inventory:renderInventoryPro,expenses:renderExpensesPro,accounts:renderAccountsPro,supplierPayments:renderSupplierPaymentsPro,workers:renderWorkersPro,purchases:renderPurchasesPro,shortages:renderShortagesPro,reports:renderReportsPro};
    if(container && custom[state.currentScreen]){ rebuildAllBalances(); applyTheme(); updateHeader(); updatePendingSyncBadge(); updateAlertsBadge(); custom[state.currentScreen](container); ensureSideMenu(); return; }
    previousRender(); ensureSideMenu(); if(state.currentScreen==='settings') appendSettingsPro();
  };

  const oldOpenQuick = window.openQuickActions;
  window.openQuickActions = function(){ openModal({title:'إجراءات سريعة',body:`<div class="grid grid-cols-2 gap-3"><button onclick="closeModal();navigate('cashier')" class="btn fancy-card rounded-[24px] p-4 text-right"><div class="font-extrabold">الكاشير</div></button><button onclick="closeModal();showProductModalPro()" class="btn fancy-card rounded-[24px] p-4 text-right"><div class="font-extrabold">صنف جديد</div></button><button onclick="closeModal();showPurchaseModalPro()" class="btn fancy-card rounded-[24px] p-4 text-right"><div class="font-extrabold">مشتريات</div></button><button onclick="closeModal();showExpenseModalPro()" class="btn fancy-card rounded-[24px] p-4 text-right"><div class="font-extrabold">مصروف</div></button><button onclick="closeModal();showExpenseModalPro('wage')" class="btn fancy-card rounded-[24px] p-4 text-right"><div class="font-extrabold">أجر عامل</div></button><button onclick="closeModal();showAccountModalPro()" class="btn fancy-card rounded-[24px] p-4 text-right"><div class="font-extrabold">حساب دفع</div></button></div>`}); };

  Object.assign(window,{showProductModal:window.showProductModalPro,saveProduct:window.saveProductPro,deleteProduct:window.deleteProductPro,exportInventoryExcel:window.exportInventoryExcelPro,showExpenseModal:window.showExpenseModalPro,saveExpense:window.saveExpensePro,deleteExpense:window.deleteExpensePro,showAccountModal:window.showAccountModalPro,saveAccount:window.saveAccountPro,showSupplierPaymentModal:window.showSupplierPaymentModalPro,saveSupplierPayment:window.saveSupplierPaymentPro,deleteSupplierPayment:window.deleteSupplierPaymentPro,addProductToCart:window.addProductToCartPro,clearCashierCart:window.clearCashierCartPro,completeCashierSale:window.completeCashierSalePro});

  window.addEventListener('barcode:scanned', (ev)=>{
    try{
      if(state.currentScreen !== 'cashier') return;
      const code = String(ev.detail?.code || '');
      if(!code) return;
      const p = arr('products').find(x => String(x.barcode||x.code||'') === code);
      if(p) window.addProductToCartPro(p.id);
    }catch(e){ console.warn(e); }
  });
  window.addEventListener('online',()=>{ normalizeProData(); rebuildAllBalances(); saveAppState(); if(state.queue&&state.queue.length&&!isLocalOnlyMode()) setTimeout(()=>syncQueueToCloud(),250); });
  document.addEventListener('DOMContentLoaded',()=>{ normalizeProData(); ensureSideMenu(); });
  try{ normalizeProData(); ensureSideMenu(); }catch(e){ console.error(e); }
})();
</script>

<script id="fee-scanner-open-above-modals-fix-2026-05-05">
(function(){
  function liftScanner(){
    var page = document.getElementById('feeScannerPage');
    if(!page) return;
    try{ document.body.appendChild(page); }catch(e){}
    page.style.setProperty('z-index','2147483600','important');
    page.style.setProperty('position','fixed','important');
    page.style.setProperty('inset','0','important');
    page.style.setProperty('width','100vw','important');
    page.style.setProperty('height','100dvh','important');
    page.style.setProperty('overflow','hidden','important');
  }

  function patchScannerFns(){
    if(window.__feeScannerTopPatchApplied) return true;
    if(typeof window.openFeeScanner !== 'function' || typeof window.stopFeeScanner !== 'function') return false;
    window.__feeScannerTopPatchApplied = true;
    var originalOpen = window.openFeeScanner;
    var originalStop = window.stopFeeScanner;

    window.openFeeScanner = async function(){
      document.body.classList.add('fee-scanner-open');
      liftScanner();
      try{
        var result = originalOpen.apply(this, arguments);
        liftScanner();
        setTimeout(liftScanner, 25);
        setTimeout(liftScanner, 150);
        setTimeout(liftScanner, 400);
        return await result;
      }catch(err){
        document.body.classList.remove('fee-scanner-open');
        throw err;
      }
    };

    window.stopFeeScanner = async function(){
      try{
        return await originalStop.apply(this, arguments);
      }finally{
        document.body.classList.remove('fee-scanner-open');
      }
    };
    return true;
  }

  function waitPatch(){
    if(patchScannerFns()) return;
    var tries = 0;
    var timer = setInterval(function(){
      tries++;
      if(patchScannerFns() || tries > 80) clearInterval(timer);
    }, 100);
  }

  waitPatch();
  document.addEventListener('click', function(e){
    var btn = e.target && e.target.closest && e.target.closest('[onclick*="openFeeScanner"]');
    if(btn){
      document.body.classList.add('fee-scanner-open');
      setTimeout(liftScanner, 0);
      setTimeout(liftScanner, 120);
    }
  }, true);
})();
</script>

  function fatoraAllExistingMovements(){
    const map = new Map();
    fpArr('accountMovements').forEach(m=>{ if(m && (m.id || (m.accountId + '_' + m.refId + '_' + m.label))) map.set(m.id || (m.accountId + '_' + m.refId + '_' + m.label), m); });
    fpArr('paymentAccounts').forEach(a=> (Array.isArray(a.movements)?a.movements:[]).forEach(m=>{ if(m) map.set(m.id || (m.accountId + '_' + m.refId + '_' + m.label), m); }));
    return Array.from(map.values());
  }
  function fatoraSigned(m){ return (m.type === 'deposit' || m.type === 'in' || m.direction === 'in') ? 1 : -1; }
  function fatoraMove(accountId,type,amount,currency,label,refId,date){
    if(!accountId || !fpNum(amount)) return null;
    return { id:'auto_' + (refId || fpUid('ref')) + '_' + Math.abs(fatoraSigned({type})) + '_' + accountId, accountId, type, amount:fpToBase(amount, currency || fpBaseCurrency().code), currency:fpBaseCurrency().code, label, refId:refId || '', date:date || new Date().toISOString(), auto:true };
  }
  window.fatoraRebuildAccountsAndBalances = function(save=false){
    try{ if(typeof rebuildCustomerBalances === 'function') rebuildCustomerBalances(); }catch(e){}
    fpArr('paymentAccounts'); fpArr('accountMovements');
    const oldMoves = fatoraAllExistingMovements();
    const oldByRef = {};
    oldMoves.forEach(m=>{ if(m && m.refId){ (oldByRef[m.refId] ||= []).push(m); } });
    const explicitRefs = new Set();
    const invoiceIds = new Set(fpArr('invoices').map(x=>x.id));
    const sourceIds = new Set([...invoiceIds, ...fpArr('expenses').map(x=>x.id), ...fpArr('wages').map(x=>x.id), ...fpArr('purchases').map(x=>x.id), ...fpArr('supplierPayments').map(x=>x.id)]);
    fpArr('paymentAccounts').forEach(a=>{
      const current = fpNum(a.balance);
      const oldSum = oldMoves.filter(m=>m.accountId===a.id).reduce((s,m)=>s + fatoraSigned(m) * fpNum(m.amount),0);
      if(a.openingBalance === undefined || a.openingBalance === null || a.openingBalance === '') a.openingBalance = current - oldSum;
      a.balance = fpNum(a.openingBalance);
      a.movements = [];
    });
    const moves = [];
    oldMoves.filter(m=>!m.refId || m.manual || m.isManual || String(m.refId).startsWith('manual')).forEach(m=>moves.push({...m, manual:true}));
    fpArr('invoices').forEach(inv=>{
      const t = fpTotals(inv); const acc = inv.accountId || inv.paymentAccountId || inv.bankAccountId || inv.account || '';
      if(acc && fpNum(t.paid)>0){ explicitRefs.add(inv.id); moves.push(fatoraMove(acc,'deposit',t.paid,inv.currency || fpBaseCurrency().code,`وارد فاتورة ${inv.invoiceNumber || inv.id}`,inv.id,inv.date)); }
      else if(oldByRef[inv.id]) oldByRef[inv.id].forEach(m=>moves.push({...m, legacy:true}));
    });
    fpArr('expenses').forEach(e=>{ if(e.accountId && fpNum(e.amount)){ explicitRefs.add(e.id); moves.push(fatoraMove(e.accountId,'withdraw',e.amount,e.currency,`مصروف: ${e.category || e.name || ''}`,e.id,e.date)); } });
    fpArr('wages').forEach(w=>{ if(w.accountId && fpNum(w.amount)){ explicitRefs.add(w.id); moves.push(fatoraMove(w.accountId,'withdraw',w.amount,w.currency,`أجر عامل: ${w.workerName || w.category || ''}`,w.id,w.date)); } });
    fpArr('purchases').forEach(p=>{ const paid = fpNum(p.paidAmount ?? p.paid ?? p.amount ?? p.price); if(p.accountId && paid){ explicitRefs.add(p.id); moves.push(fatoraMove(p.accountId,'withdraw',paid,p.currency,`مشتريات: ${p.productName || p.supplierName || ''}`,p.id,p.date)); } });
    fpArr('supplierPayments').forEach(sp=>{ if(sp.accountId && fpNum(sp.amount)){ explicitRefs.add(sp.id); moves.push(fatoraMove(sp.accountId,'withdraw',sp.amount,sp.currency,`دفعة تاجر: ${sp.supplierName || sp.name || ''}`,sp.id,sp.date)); } });
    const dedup = new Map();
    moves.filter(Boolean).forEach(m=>{
      if(m.refId && !sourceIds.has(m.refId) && !m.manual) return;
      const key = m.id || [m.accountId,m.type,m.refId,m.label,m.amount].join('|');
      dedup.set(key,m);
    });
    const finalMoves = Array.from(dedup.values()).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    finalMoves.forEach(m=>{
      const a = fpArr('paymentAccounts').find(x=>x.id===m.accountId); if(!a) return;
      a.balance = fpNum(a.balance) + fatoraSigned(m) * fpNum(m.amount);
      a.movements.push(m);
    });
    state.data.accountMovements = finalMoves;
    if(save){
      try{ saveAppState(); }catch(e){}
      try{ enqueueSyncOperation({type:'accounting_rebuild', payload:{at:Date.now()}}); }catch(e){}
      try{ updatePendingSyncBadge(); updateAlertsBadge(); }catch(e){}
      try{ if(!isLocalOnlyMode() && navigator.onLine) setTimeout(()=>syncQueueToCloud(),160); }catch(e){}
    }
    return true;
  };

  function renderInvoicesFinal(el){ const rows=arr('invoices').slice().sort((a,b)=>new Date(b.date)-new Date(a.date)); el.innerHTML=`<div class="space-y-5"><div class="flex justify-between items-center gap-3 flex-wrap"><div><h2 class="text-2xl font-black">الفواتير</h2><p class="text-sm text-slate-500 mt-1 font-bold">بحث، عرض، وطباعة حرارية بدون روابط معاينة.</p></div><button onclick="showInvoiceModal&&showInvoiceModal()" class="btn bg-blue-600 text-white px-4 py-3 rounded-2xl font-extrabold"><i class="fas fa-plus"></i> فاتورة جديدة</button></div><div class="section-card p-4 space-y-3"><input class="input" placeholder="بحث برقم الفاتورة أو اسم العميل أو الهاتف" oninput="fatoraFilterInvoiceCards(this.value)"><div class="flex gap-2 flex-wrap"><button class="fatora-chip dark" onclick="fatoraPrintInvoicesTable&&fatoraPrintInvoicesTable()"><i class="fas fa-print"></i> طباعة جدول</button><button class="fatora-chip teal" onclick="fatoraDownloadInvoicesTableImage&&fatoraDownloadInvoicesTableImage()"><i class="fas fa-image"></i> صورة جدول</button><button class="fatora-chip green" onclick="fatoraDownloadInvoicesTablePDF&&fatoraDownloadInvoicesTablePDF()"><i class="fas fa-file-pdf"></i> PDF جدول</button></div></div><div class="space-y-3" id="fatora-invoice-card-list">${rows.map(invoicesCard).join('')||'<div class="fancy-card rounded-[28px] text-center text-slate-400 py-12">لا توجد فواتير</div>'}</div></div>`; }
