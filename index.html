    el.innerHTML=`<div class="space-y-5"><div class="flex justify-between items-center gap-3 flex-wrap"><div><h2 class="text-2xl font-black">حسابات الدفع والتحويل</h2><p class="text-sm text-slate-500 font-bold">اضغط على أي حساب لعرض سجله الخاص.</p></div><button onclick="showAccountModalPro&&showAccountModalPro()" class="fatora-chip dark"><i class="fas fa-plus"></i> حساب</button></div><div class="grid grid-cols-3 gap-3"><div class="fatora-stat-card"><small>الوارد</small><b style="color:#15803d">${money(incoming)}</b></div><div class="fatora-stat-card"><small>الصادر</small><b style="color:#dc2626">${money(outgoing)}</b></div><div class="fatora-stat-card"><small>الحركات</small><b>${moves.length}</b></div></div><div class="grid sm:grid-cols-2 gap-3">${accounts.map(a=>`<button class="fee-account-ledger-card text-right" onclick="feeOpenAccountLedger('${esc(a.id)}')"><div class="flex justify-between gap-2"><div><div class="font-black">${esc(a.name)}</div><div class="text-xs text-slate-500 font-bold mt-1">${esc(a.type||'')} ${a.number?'- '+esc(a.number):''}</div></div><div class="font-black text-xl text-green-700">${money(a.balance)}</div></div></button>`).join('')||'<div class="fee-card p-5 text-center text-slate-400">لا توجد حسابات</div>'}</div>${selected?`<div class="section-card p-4"><h3 class="font-black mb-3">سجل ${esc(selected.name)}</h3>${moves.filter(m=>m.accountId===selected.id).map(m=>`<div class="fee-ledger-row"><div class="fee-ledger-icon ${signed(m)>0?'in':'out'}"><i class="fas ${signed(m)>0?'fa-arrow-down':'fa-arrow-up'}"></i></div><div><div class="font-black">${esc(m.label||'حركة')}</div><div class="text-xs text-slate-500 font-bold">${esc(fmt(m.date))}</div></div><div class="font-black ${signed(m)>0?'text-green-700':'text-red-600'}">${signed(m)>0?'+':'-'} ${money(m.amount)}</div></div>`).join('')||'<div class="text-center text-slate-400 py-8">لا توجد حركات لهذا الحساب</div>'}</div>`:''}</div>`;

<script id="fee-accounting-customer-carton-v3-script">
(function(){
  'use strict';
  if(window.__feeAccountingCustomerCartonV3) return;
  window.__feeAccountingCustomerCartonV3 = true;

  const $ = id => document.getElementById(id);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
  const n = v => { const x = parseFloat(v); return Number.isFinite(x) ? x : 0; };
  const arr = k => { if(!state.data[k] || !Array.isArray(state.data[k])) state.data[k] = []; return state.data[k]; };
  const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const uid2 = p => (typeof uid === 'function' ? uid(p) : (p + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8)));
  const now = () => new Date().toISOString();
  const toast = (m,t='success') => { try{ showToast(m,t); }catch(e){ console.log(m); } };
  const money = v => { try{ return formatCurrency(Number(v||0)); }catch(e){ return Number(v||0).toLocaleString('en-US') + ' ' + (state.data.settings?.currency || 'شيكل'); } };
  const fmt = v => { try{ return formatDate(v); }catch(e){ return v ? new Date(v).toLocaleString('ar-EG') : ''; } };

  function normalizeId(id){
    if(id === 'cash' || id === 'كاش' || id === 'الصندوق') return '__cash__';
    return id || '';
  }

  function ensureCashAccountV3(){
    let a = arr('paymentAccounts').find(x => x.id === '__cash__' || x.isCashDefault || String(x.type||'').toLowerCase() === 'cash');
    if(!a){
      a = {id:'__cash__', name:'كاش / الصندوق', type:'cash', number:'', openingBalance:0, balance:0, movements:[], isCashDefault:true, createdAt:now()};
      arr('paymentAccounts').unshift(a);
    }
    if(!a.id) a.id='__cash__';
    if(String(a.type||'').toLowerCase()==='cash') a.isCashDefault = true;
    if(!Array.isArray(a.movements)) a.movements = [];
    return a;
  }

  function baseCurrencyCode(){
    const list = arr('currencies');
    const c = list.find(x=>x.isBase) || list[0];
    return c?.code || 'ILS';
  }
  function currencyRate(code){
    const list = arr('currencies');
    const c = list.find(x=>x.code===code) || list.find(x=>x.isBase) || list[0];
    return n(c?.rateToBase) || 1;
  }
  function toBaseV3(amount, code){ return n(amount) * currencyRate(code || baseCurrencyCode()); }

  function movementSign(m){
    const t = String(m?.type || m?.direction || '').toLowerCase();
    if(['deposit','in','income','incoming','وارد','إيداع'].includes(t)) return 1;
    if(['withdraw','out','expense','outgoing','صادر','سحب'].includes(t)) return -1;
    return n(m?.amount) < 0 ? -1 : 1;
  }
  function movement(accountId, kind, amount, label, refId, date, source){
    accountId = normalizeId(accountId);
    const value = Math.abs(n(amount));
    if(!accountId || !value) return null;
    return {id:['v3',source||'src',String(refId||uid2('ref')).replace(/[^a-zA-Z0-9_\-]/g,'_'),accountId,kind].join('_'), accountId, type:kind==='in'?'deposit':'withdraw', amount:value, currency:baseCurrencyCode(), label:label||'', refId:refId||'', date:date||now(), auto:true, source:source||''};
  }
  function totals(inv){
    try{ return calculateInvoiceTotals(inv); }catch(e){
      const subtotal = n(inv?.subtotalBase ?? inv?.subtotal);
      const discount = n(inv?.discountBase ?? inv?.discount);
      const total = Math.max(0, subtotal - discount);
      const paid = n(inv?.paidBase ?? inv?.paidAmount ?? inv?.paid);
      return {subtotal, discount, total, paid, remaining:Math.max(0,total-paid)};
    }
  }
  function invoiceCompleted(inv){
    const t = totals(inv);
    const s = String(inv?.status || '').toLowerCase();
    return s === 'completed' || s === 'paid' || s === 'مكتملة' || (t.remaining <= 0 && t.total > 0 && t.paid > 0);
  }
  function isAutoLabel(label){
    return /(فاتورة|بيع|دفعة عميل|مصروف|مشتريات|أجر|راتب|دفعة تاجر|مورد)/.test(String(label||''));
  }
  function manualMoveKey(m){ return [normalizeId(m.accountId), movementSign(m)>0?'deposit':'withdraw', Math.abs(n(m.amount)).toFixed(4), String(m.date||'').slice(0,19), String(m.label||'')].join('|'); }

  function collectManualMovements(){
    const collected = [];
    const push = m => {
      if(!m) return;
      const accountId = normalizeId(m.accountId);
      const amount = Math.abs(n(m.amount));
      if(!accountId || !amount) return;
      const manual = m.manual || m.isManual || m.source === 'manual' || (!m.auto && (!m.refId || String(m.refId).startsWith('manual')) && !isAutoLabel(m.label));
      if(!manual) return;
      collected.push({
        id:m.id || ('manual_' + Math.random().toString(36).slice(2)),
        accountId,
        type: movementSign(m)>0 ? 'deposit' : 'withdraw',
        amount,
        currency:m.currency || baseCurrencyCode(),
        label:m.label || 'حركة يدوية',
        refId:m.refId || 'manual',
        date:m.date || now(),
        manual:true,
        source:'manual'
      });
    };
    arr('accountManualMovements').forEach(push);
    arr('accountMovements').forEach(push);
    arr('paymentAccounts').forEach(a => (Array.isArray(a.movements)?a.movements:[]).forEach(m => push({...m, accountId:a.id})));
    const map = new Map();
    collected.forEach(m => map.set(m.id || manualMoveKey(m), m));
    state.data.accountManualMovements = Array.from(map.values()).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    return state.data.accountManualMovements;
  }

  function accountHasSource(id, manualMoves){
    id = normalizeId(id);
    if(manualMoves.some(m=>normalizeId(m.accountId)===id)) return true;
    const hasInv = arr('invoices').some(inv => normalizeId(inv.accountId || inv.paymentAccountId || inv.bankAccountId || '') === id && invoiceCompleted(inv) && totals(inv).paid > 0);
    const hasPay = arr('customers').some(c => (c.payments||[]).some(p => normalizeId(p.accountId || p.paymentAccountId || '') === id && n(p.amount) > 0));
    const hasOut = ['expenses','wages','purchases','supplierPayments'].some(k => arr(k).some(x => normalizeId(x.accountId || x.paymentAccountId || '') === id && n(x.amount ?? x.paidAmount ?? x.paid ?? x.price) > 0));
    return hasInv || hasPay || hasOut;
  }

  function stableOpening(a, manualMoves){
    if(a.id === '__cash__' || a.isCashDefault) {
      a.openingBalance = n(a.openingBalance || 0);
      return a.openingBalance;
    }
    if(a.openingBalanceV3 !== undefined && a.openingBalanceV3 !== null && a.openingBalanceV3 !== '') return n(a.openingBalanceV3);
    if(a.openingBalance !== undefined && a.openingBalance !== null && a.openingBalance !== '') {
      a.openingBalanceV3 = n(a.openingBalance);
      return a.openingBalanceV3;
    }
    if(!accountHasSource(a.id, manualMoves) && a.balance !== undefined && a.balance !== null && a.balance !== '') a.openingBalanceV3 = n(a.balance);
    else a.openingBalanceV3 = 0;
    a.openingBalance = a.openingBalanceV3;
    return a.openingBalanceV3;
  }

  function rebuildCustomerBalancesV3(){
    const map = {};
    arr('customers').forEach(c => { map[c.id] = 0; });
    arr('invoices').forEach(inv => {
      const cid = inv.customerId || '';
      if(!cid) return;
      map[cid] = (map[cid] || 0) + totals(inv).remaining;
    });
    arr('customers').forEach(c => {
      const manualDebt = (c.manualDebts||[]).reduce((s,d)=>s+n(d.amount),0);
      const payments = (c.payments||[]).reduce((s,p)=>s+n(p.amount),0);
      c.balance = Number(((map[c.id] || 0) + manualDebt - payments).toFixed(4));
    });
  }
  window.rebuildCustomerBalances = rebuildCustomerBalancesV3;
  try{ rebuildCustomerBalances = rebuildCustomerBalancesV3; }catch(e){}

  function rebuildAccountsV3(save=false){
    ensureCashAccountV3();
    rebuildCustomerBalancesV3();
    const manual = collectManualMovements();
    const accounts = arr('paymentAccounts');
    accounts.forEach(a => { a.id = normalizeId(a.id) || uid2('acc'); a.openingBalance = stableOpening(a, manual); a.balance = n(a.openingBalance); a.movements = []; });

    const moves = [];
    manual.forEach(m => moves.push({...m, amount:Math.abs(n(m.amount)), type:movementSign(m)>0?'deposit':'withdraw'}));

    arr('invoices').forEach(inv => {
      const t = totals(inv);
      const acc = normalizeId(inv.accountId || inv.paymentAccountId || inv.bankAccountId || '');
      if(acc && t.paid > 0 && invoiceCompleted(inv)) moves.push(movement(acc,'in',t.paid,'وارد فاتورة ' + (inv.invoiceNumber || inv.id), inv.id, inv.date, 'invoice'));
    });
    arr('customers').forEach(c => (c.payments||[]).forEach(p => {
      const acc = normalizeId(p.accountId || p.paymentAccountId || '');
      if(acc && n(p.amount) > 0) moves.push(movement(acc,'in',toBaseV3(p.amount,p.currency), 'دفعة عميل: ' + (c.name || ''), p.id || (c.id + '_' + p.date), p.date, 'customer_payment'));
    }));
    arr('expenses').forEach(e => { const acc=normalizeId(e.accountId||e.paymentAccountId||''); if(acc && n(e.amount)>0) moves.push(movement(acc,'out',toBaseV3(e.amount,e.currency),'مصروف: '+(e.category||e.name||''),e.id,e.date,'expense')); });
    arr('wages').forEach(w => { const acc=normalizeId(w.accountId||w.paymentAccountId||''); if(acc && n(w.amount)>0) moves.push(movement(acc,'out',toBaseV3(w.amount,w.currency),'أجر عامل: '+(w.workerName||w.employeeName||w.category||''),w.id,w.date,'wage')); });
    arr('purchases').forEach(p => { const acc=normalizeId(p.accountId||p.paymentAccountId||''); const paid=n(p.paidAmount ?? p.paid ?? p.amount ?? p.price); if(acc && paid>0) moves.push(movement(acc,'out',toBaseV3(paid,p.currency),'مشتريات: '+(p.productName||p.supplierName||''),p.id,p.date,'purchase')); });
    arr('supplierPayments').forEach(sp => { const acc=normalizeId(sp.accountId||sp.paymentAccountId||''); if(acc && n(sp.amount)>0) moves.push(movement(acc,'out',toBaseV3(sp.amount,sp.currency),'دفعة تاجر: '+(sp.supplierName||sp.name||''),sp.id,sp.date,'supplier_payment')); });

    const unique = new Map();
    moves.filter(Boolean).forEach(m => unique.set(m.id || [m.source,m.accountId,m.refId,m.type,Math.abs(n(m.amount))].join('|'), m));
    const final = Array.from(unique.values()).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
    final.forEach(m => {
      const a = accounts.find(x => normalizeId(x.id) === normalizeId(m.accountId));
      if(!a) return;
      const value = Math.abs(n(m.amount));
      a.balance = Number((n(a.balance) + (movementSign(m)>0 ? value : -value)).toFixed(4));
      a.movements.push({...m, amount:value});
    });
    state.data.accountMovements = final;
    if(save){
      try{ saveAppState(); }catch(e){}
      try{ enqueueSyncOperation({type:'accounting_rebuild_v3', payload:{at:Date.now()}}); updatePendingSyncBadge(); }catch(e){}
      try{ if(!isLocalOnlyMode() && navigator.onLine) setTimeout(()=>syncQueueToCloud(),120); }catch(e){}
    }
    return true;
  }
  window.feeFinalRebuildAccountsV3 = rebuildAccountsV3;
  window.fatoraRebuildAccountsAndBalances = rebuildAccountsV3;

  function addAccountMovementV3(accountId, type, amount, label, refId=''){
    accountId = normalizeId(accountId);
    const value = Math.abs(n(amount));
    if(!accountId || !value) return;
    // movements that belong to invoices / expenses / purchases are rebuilt from their real records, so do not duplicate them here
    if(refId && isAutoLabel(label)) { rebuildAccountsV3(true); return; }
    const m = {id:uid2('manual_mov'), accountId, type:(type==='deposit'||type==='in')?'deposit':'withdraw', amount:value, label:label||'حركة يدوية', refId:'manual_'+Date.now(), date:now(), manual:true, source:'manual'};
    arr('accountManualMovements').unshift(m);
    rebuildAccountsV3(true);
  }
  window.addAccountMovement = addAccountMovementV3;
  window.addAccountMovementPro = addAccountMovementV3;
  try{ addAccountMovement = addAccountMovementV3; }catch(e){}

  function accountOptions(selected='__cash__'){
    ensureCashAccountV3();
    selected = normalizeId(selected || '__cash__');
    return arr('paymentAccounts').map(a => `<option value="${esc(normalizeId(a.id))}" ${normalizeId(a.id)===selected?'selected':''}>${esc(a.name||'حساب')} - ${money(a.balance||0)}</option>`).join('');
  }
  window.feeV3AccountOptions = accountOptions;

  const oldSaveAccount = window.saveAccountPro || window.saveAccount;
  window.saveAccountPro = window.saveAccount = function(){
    const id = $('acc-id')?.value || '';
    const name = $('acc-name')?.value?.trim();
    if(!name){ toast('أدخل اسم الحساب','error'); return; }
    const balance = n($('acc-balance')?.value);
    const payload = {id:id||uid2('acc'), name, type:$('acc-type')?.value||'cash', number:$('acc-number')?.value?.trim()||'', openingBalance:balance, openingBalanceV3:balance, balance, updatedAt:now()};
    const i = arr('paymentAccounts').findIndex(a=>a.id===id);
    if(i>=0) arr('paymentAccounts')[i] = {...arr('paymentAccounts')[i], ...payload, movements:Array.isArray(arr('paymentAccounts')[i].movements)?arr('paymentAccounts')[i].movements:[]};
    else arr('paymentAccounts').push({...payload, movements:[], createdAt:now()});
    try{ closeModal(); }catch(e){}
    rebuildAccountsV3(true);
    try{ render(); }catch(e){}
    toast('تم حفظ الحساب وإعادة حساب رصيده','success');
  };
  window.saveAccountMovement = function(){
    const id=$('mov-account')?.value; const type=$('mov-type')?.value||'deposit'; const amount=n($('mov-amount')?.value); if(amount<=0){toast('أدخل المبلغ','error');return;}
    addAccountMovementV3(id,type,amount,$('mov-label')?.value?.trim()||'حركة يدوية');
    try{ closeModal(); render(); }catch(e){}
  };

  function getCustomer(id){ return arr('customers').find(c=>c.id===id); }
  window.showPaymentModal = function(customerId=''){
    const customerOptions = arr('customers').map(c=>`<option value="${esc(c.id)}" ${customerId===c.id?'selected':''}>${esc(c.name)}${c.phone?' - '+esc(c.phone):''}</option>`).join('');
    openModal({title:'إضافة دفعة عميل',maxWidth:'680px',body:`<div class="space-y-4"><div><label class="block text-sm font-bold text-slate-700 mb-2">العميل</label><select id="payment-customer-id" class="select"><option value="">اختر العميل</option>${customerOptions}</select></div><div class="grid sm:grid-cols-2 gap-3"><div><label class="block text-sm font-bold text-slate-700 mb-2">المبلغ</label><input id="payment-amount" type="number" class="input" value="0" step="0.01"></div><div><label class="block text-sm font-bold text-slate-700 mb-2">دخلت على حساب</label><select id="payment-account-id" class="select">${accountOptions('__cash__')}</select></div></div><div><label class="block text-sm font-bold text-slate-700 mb-2">ملاحظة</label><textarea id="payment-note" class="textarea" placeholder="دفعة كاش / تحويل بنك / ملاحظة"></textarea></div></div>`,footer:`<div class="flex gap-3"><button onclick="closeModal()" class="btn flex-1 py-3 rounded-2xl bg-slate-100 font-bold">إلغاء</button><button onclick="savePayment()" class="btn flex-1 py-3 rounded-2xl bg-green-600 text-white font-extrabold">حفظ الدفعة</button></div>`});
  };
  window.savePayment = function(){
    const customerId=$('payment-customer-id')?.value; const amount=n($('payment-amount')?.value); const customer=getCustomer(customerId); const accountId=normalizeId($('payment-account-id')?.value||'__cash__');
    if(!customer){toast('اختر العميل أولاً','error');return;} if(amount<=0){toast('أدخل مبلغاً صحيحاً','error');return;}
    customer.payments = customer.payments || [];
    customer.payments.push({id:uid2('payment'), amount, note:$('payment-note')?.value?.trim()||'', accountId, paymentAccountId:accountId, paymentMethod:accountId==='__cash__'?'cash':'account', date:now(), createdBy:state.session?.userId||'owner'});
    try{ enqueueSyncOperation({type:'add_payment_v3',payload:{customerId,amount,accountId}}); }catch(e){}
    try{ closeModal(); }catch(e){}
    rebuildAccountsV3(true);
    try{ render(); }catch(e){}
    toast('تمت إضافة الدفعة وربطها بالحساب','success');
  };
  window.showManualDebtModal = function(customerId=''){
    const customerOptions = arr('customers').map(c=>`<option value="${esc(c.id)}" ${customerId===c.id?'selected':''}>${esc(c.name)}${c.phone?' - '+esc(c.phone):''}</option>`).join('');
    openModal({title:'إضافة دين مباشر',maxWidth:'620px',body:`<div class="space-y-4"><div><label class="block text-sm font-bold text-slate-700 mb-2">العميل</label><select id="manual-debt-customer-id" class="select"><option value="">اختر العميل</option>${customerOptions}</select></div><div><label class="block text-sm font-bold text-slate-700 mb-2">المبلغ</label><input id="manual-debt-amount" type="number" class="input" value="0" step="0.01"></div><div><label class="block text-sm font-bold text-slate-700 mb-2">ملاحظة</label><textarea id="manual-debt-note" class="textarea"></textarea></div></div>`,footer:`<div class="flex gap-3"><button onclick="closeModal()" class="btn flex-1 py-3 rounded-2xl bg-slate-100 font-bold">إلغاء</button><button onclick="saveManualDebt()" class="btn flex-1 py-3 rounded-2xl bg-red-600 text-white font-extrabold">حفظ الدين</button></div>`});
  };
  window.saveManualDebt = function(){
    if(window.feeCheckDailyLimit && !window.feeCheckDailyLimit('manualDebts','الدين اليدوي')) return;
    const customerId=$('manual-debt-customer-id')?.value; const amount=n($('manual-debt-amount')?.value); const customer=getCustomer(customerId);
    if(!customer){toast('اختر العميل أولاً','error');return;} if(amount<=0){toast('أدخل مبلغاً صحيحاً','error');return;}
    customer.manualDebts = customer.manualDebts || [];
    customer.manualDebts.push({id:uid2('debt'), amount, note:$('manual-debt-note')?.value?.trim()||'', date:now(), createdBy:state.session?.userId||'owner'});
    try{ enqueueSyncOperation({type:'add_manual_debt_v3',payload:{customerId,amount}}); }catch(e){}
    try{ closeModal(); }catch(e){}
    rebuildAccountsV3(true);
    try{ render(); }catch(e){}
    toast('تمت إضافة الدين وإعادة حساب العميل','success');
  };
  try{ savePayment = window.savePayment; showPaymentModal = window.showPaymentModal; saveManualDebt = window.saveManualDebt; showManualDebtModal = window.showManualDebtModal; }catch(e){}

  function readSelectedPaymentAccount(){
    const ids = ['cashier-simple-account','cashier-pay-account','fee-cashier-account','invoice-complete-account','payment-account-id'];
    for(const id of ids){ const v = normalizeId($(id)?.value || ''); if(v) return v; }
    return '__cash__';
  }
  function markInvoiceAccount(inv, acc){
    if(!inv) return;
    acc = normalizeId(acc || readSelectedPaymentAccount());
    if(acc){ inv.accountId = acc; inv.paymentAccountId = acc; inv.paymentMethod = acc==='__cash__'?'cash':'account'; }
  }
  const oldCreateCashier = window.createCashierInvoicePro;
  if(typeof oldCreateCashier === 'function'){
    window.createCashierInvoicePro = function(opts={}){
      const res = oldCreateCashier.apply(this, arguments);

  const oldCompleteCashier = window.completeCashierSale;

    window.completeCashierSale = function(){ const r = oldCompleteCashier.apply(this, arguments); setTimeout(()=>{ const inv=arr('invoices')[arr('invoices').length-1]; if(inv) markInvoiceAccount(inv, readSelectedPaymentAccount()); rebuildAccountsV3(true); try{render();}catch(e){} },60); return r; };

  const oldSaveStatus = window.saveInvoiceStatusChange;

    rebuildAccountsV3(true);
    try{ render(); }catch(e){}
    toast('تم تحديث الفاتورة والحسابات بشكل صحيح','success');
  };

  function productPieces(p){ return Math.max(1, n(p?.piecesPerCarton)||1); }
  function normalizeCartonProduct(p){
    if(!p || p.unitType !== 'carton') return;
    const pieces = productPieces(p);
    const carton = n(p.salePriceCarton ?? p.salePrice);
    p.salePriceCarton = carton;
    p.salePrice = carton;
    p.salePricePiece = +(carton / pieces).toFixed(4);
  }
  arr('products').forEach(normalizeCartonProduct);

  const oldShowProductModal = window.showProductModalPro || window.showProductModal;
  if(typeof oldShowProductModal === 'function'){
    window.showProductModalPro = window.showProductModal = function(id=''){
      const r = oldShowProductModal.apply(this, arguments);
      setTimeout(()=>{
        const unit = $('prod-unit-type')?.value;

        const sale = $('prod-sale');
        const salePiece = $('prod-sale-piece');
        const saleCarton = $('prod-sale-carton');
        if(sale && unit === 'carton'){
          const parent = sale.closest('div');
          const label = parent?.querySelector('label'); if(label) label.textContent = 'سعر البيع كرتونة';
          const p = arr('products').find(x=>x.id===id)||{};
          sale.value = n(p.salePriceCarton ?? p.salePrice ?? sale.value);
          if(parent && !parent.querySelector('.fee-product-carton-note')) parent.insertAdjacentHTML('beforeend', `<div class="fee-product-carton-note mt-2">أدخل سعر بيع الكرتونة فقط. عند البيع بالقطعة سيتم تقسيم سعر الكرتونة على عدد القطع تلقائياً.</div>`);
        }
        if(salePiece){ const d=salePiece.closest('div'); if(d) d.classList.add('fee-hide-piece-price-final'); salePiece.value = (n(saleCarton?.value || sale?.value) / pieces).toFixed(4); }
        if(saleCarton){ const d=saleCarton.closest('div'); if(d) d.classList.add('fee-hide-piece-price-final'); saleCarton.value = n(sale?.value || saleCarton.value); }
      },30);
      return r;
    };
    try{ showProductModalPro = window.showProductModalPro; showProductModal = window.showProductModal; }catch(e){}
  }
  const oldToggle = window.toggleProductUnitFields;
  window.toggleProductUnitFields = function(){
    try{ oldToggle && oldToggle.apply(this, arguments); }catch(e){}
    const unit = $('prod-unit-type')?.value;
    const sale = $('prod-sale');

  const oldSaveProduct = window.saveProductPro || window.saveProduct;

    window.saveProductPro = window.saveProduct = function(){
      const unit = $('prod-unit-type')?.value;
      if(unit === 'carton'){
        const pieces = Math.max(1, n($('prod-pieces')?.value)||1);
        const cartonPrice = n($('prod-sale')?.value || $('prod-sale-carton')?.value);
        let piece = $('prod-sale-piece');
        if(!piece){ piece=document.createElement('input'); piece.type='hidden'; piece.id='prod-sale-piece'; document.body.appendChild(piece); }
        piece.value = (cartonPrice / pieces).toFixed(4);
        let carton = $('prod-sale-carton');
        if(!carton){ carton=document.createElement('input'); carton.type='hidden'; carton.id='prod-sale-carton'; document.body.appendChild(carton); }
        carton.value = cartonPrice;
      }
      const r = oldSaveProduct.apply(this, arguments);
      setTimeout(()=>{ arr('products').forEach(normalizeCartonProduct); rebuildAccountsV3(true); try{saveAppState(); render();}catch(e){} },80);
      return r;
    };
    try{ saveProductPro = window.saveProductPro; saveProduct = window.saveProduct; }catch(e){}
  }

  function renderAccountsV3(el, accountId=''){
    rebuildAccountsV3(false);
    const accounts = arr('paymentAccounts');
    const moves = arr('accountMovements');
    const incoming = moves.filter(m=>movementSign(m)>0).reduce((s,m)=>s+Math.abs(n(m.amount)),0);
    const outgoing = moves.filter(m=>movementSign(m)<0).reduce((s,m)=>s+Math.abs(n(m.amount)),0);
    const selected = accounts.find(a=>normalizeId(a.id)===normalizeId(accountId));
    const balClass = v => n(v)>0?'fee-balance-positive':n(v)<0?'fee-balance-negative':'fee-balance-zero';
    el.innerHTML = `<div class="space-y-5"><div class="flex justify-between items-center gap-3 flex-wrap"><div><h2 class="text-2xl font-black">حسابات الدفع والتحويل</h2><p class="text-sm text-slate-500 font-bold">الوارد موجب، والصادر سالب، والحساب لا يتضاعف عند التنقل.</p></div><button onclick="showAccountModalPro&&showAccountModalPro()" class="fatora-chip dark"><i class="fas fa-plus"></i> حساب</button></div><div class="grid grid-cols-3 gap-3"><div class="fatora-stat-card"><small>الوارد</small><b style="color:#15803d">${money(incoming)}</b></div><div class="fatora-stat-card"><small>الصادر</small><b style="color:#dc2626">${money(outgoing)}</b></div><div class="fatora-stat-card"><small>الحركات</small><b>${moves.length}</b></div></div><div class="grid sm:grid-cols-2 gap-3">${accounts.map(a=>`<button class="fee-account-ledger-card text-right" onclick="feeOpenAccountLedger('${esc(a.id)}')"><div class="flex justify-between gap-2"><div><div class="font-black">${esc(a.name)}</div><div class="text-xs text-slate-500 font-bold mt-1">${esc(a.type||'')} ${a.number?'- '+esc(a.number):''}</div></div><div class="font-black text-xl ${balClass(a.balance)}">${money(a.balance)}</div></div></button>`).join('') || '<div class="fee-card p-5 text-center text-slate-400">لا توجد حسابات</div>'}</div>${selected?`<div class="section-card p-4"><h3 class="font-black mb-3">سجل ${esc(selected.name)}</h3>${moves.filter(m=>normalizeId(m.accountId)===normalizeId(selected.id)).map(m=>`<div class="fee-ledger-row"><div class="fee-ledger-icon ${movementSign(m)>0?'in':'out'}"><i class="fas ${movementSign(m)>0?'fa-arrow-down':'fa-arrow-up'}"></i></div><div><div class="font-black">${esc(m.label||'حركة')}</div><div class="text-xs text-slate-500 font-bold">${esc(fmt(m.date))}</div></div><div class="font-black ${movementSign(m)>0?'text-green-700':'text-red-600'}">${movementSign(m)>0?'+':'-'} ${money(Math.abs(n(m.amount)))}</div></div>`).join('') || '<div class="text-center text-slate-400 py-8">لا توجد حركات لهذا الحساب</div>'}</div>`:''}</div>`;
  }
  window.feeOpenAccountLedger = function(id){ const el=$('app-container'); if(el) renderAccountsV3(el,id); };

  const prevRender = window.render;
  window.render = function(){
    const r = prevRender && prevRender.apply(this, arguments);
    setTimeout(()=>{
      try{ rebuildAccountsV3(false); }catch(e){}
      const el = $('app-container');
      if(el && state.currentScreen === 'accounts') renderAccountsV3(el);
      arr('products').forEach(normalizeCartonProduct);
    },20);
    return r;
  };

  setTimeout(()=>{ try{ rebuildAccountsV3(true); if(state.currentScreen==='accounts' && $('app-container')) renderAccountsV3($('app-container')); }catch(e){ console.warn(e); } },320);
})();
</script>

<script id="fee-v4-thermal-sync-script">
(function(){
  if(window.__feeV4ThermalSyncApplied) return; window.__feeV4ThermalSyncApplied = true;
  const $ = id => document.getElementById(id);
  const $$ = sel => Array.from(document.querySelectorAll(sel));
  const esc = v => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
  const num = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
  const arr = k => { try{ if(!state.data[k]) state.data[k]=[]; return state.data[k]; }catch(e){ return []; } };
  const nowISO = () => new Date().toISOString();
  function toast(msg,type='success'){ try{ (window.showToast||showToast)(msg,type); }catch(e){ alert(msg); } }
  function money(v){ try{ return (typeof formatCurrency==='function' ? formatCurrency(num(v)) : (num(v).toLocaleString('en-US')+' '+(state?.data?.settings?.currency||''))); }catch(e){ return String(v||0); } }
  function fmt(d){ try{ return (typeof formatDate==='function'?formatDate(d):new Date(d).toLocaleString('ar-EG')); }catch(e){ return String(d||''); } }
  function uid(prefix='id'){ return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
  function getCustomer(id){ try{ return arr('customers').find(c=>c.id===id); }catch(e){ return null; } }
  function getInvoice(id){ try{ return arr('invoices').find(i=>i.id===id); }catch(e){ return null; } }
  function totals(inv){ try{ return (typeof calculateInvoiceTotals==='function'?calculateInvoiceTotals(inv):(typeof proCalculateInvoiceTotals==='function'?proCalculateInvoiceTotals(inv):{subtotal:num(inv?.subtotal),discount:num(inv?.discount),total:num(inv?.total||inv?.subtotal),paid:num(inv?.paidAmount),remaining:Math.max(0,num(inv?.total||inv?.subtotal)-num(inv?.paidAmount))})); }catch(e){ const total=num(inv?.total||inv?.subtotal); const paid=num(inv?.paidAmount); return {subtotal:total,discount:0,total,paid,remaining:Math.max(0,total-paid)}; } }
  function isCompleted(inv){ const t=totals(inv); return inv?.status==='completed' || inv?.isCompleted===true || (t.total>0 && t.remaining<=0); }
  function logoHTML(){ const s=state.data.settings||{}; return s.logo ? `<img crossorigin="anonymous" class="logo" src="${esc(s.logo)}">` : ''; }
  function itemUnitLabel(it){ return esc(it.unitLabel || it.unit || (it.unitKey==='carton'?'كرتونة':'قطعة')); }

  /* حفظ ومزامنة أي تعديل أو حذف بشكل عام: أي دالة تحفظ محلياً تعمل مزامنة كاملة بعد ثواني قليلة */
  let syncTimer=null, inSaveWrap=false;
  function fullSyncSoon(){
    clearTimeout(syncTimer);
    syncTimer=setTimeout(async()=>{
      try{ if(typeof window.feeFinalRebuildAccountsV3==='function') window.feeFinalRebuildAccountsV3(false); else if(typeof window.fatoraRebuildAccountsAndBalances==='function') window.fatoraRebuildAccountsAndBalances(false); }catch(e){}
      try{ if(typeof updatePendingSyncBadge==='function') updatePendingSyncBadge(); }catch(e){}
      try{ if(!isLocalOnlyMode() && navigator.onLine){ if(typeof pushFullStateToCloud==='function') await pushFullStateToCloud(); else if(typeof syncQueueToCloud==='function') await syncQueueToCloud(); } }catch(e){ console.warn('v4 sync failed', e); }
    }, 700);
  }
  try{
    const oldSaveAppState = window.saveAppState || saveAppState;
    if(typeof oldSaveAppState==='function' && !oldSaveAppState.__feeV4Wrapped){
      const wrapped=function(){ const r=oldSaveAppState.apply(this,arguments); if(!inSaveWrap){ inSaveWrap=true; try{ fullSyncSoon(); }finally{ setTimeout(()=>inSaveWrap=false,10); } } return r; };
      wrapped.__feeV4Wrapped=true; window.saveAppState=wrapped; try{ saveAppState=wrapped; }catch(e){}
    }
  }catch(e){}
  function persistChange(type='update', payload={}){
    try{ if(typeof window.feeFinalRebuildAccountsV3==='function') window.feeFinalRebuildAccountsV3(false); else if(typeof window.fatoraRebuildAccountsAndBalances==='function') window.fatoraRebuildAccountsAndBalances(false); }catch(e){}
    try{ if(typeof enqueueSyncOperation==='function') enqueueSyncOperation({type:'full_state_'+type, payload:{...payload, at:Date.now()}}); }catch(e){}
    try{ (window.saveAppState||saveAppState)(); }catch(e){}
    fullSyncSoon();
  }
  window.feeV4PersistChange = persistChange;

  /* تنسيق رصيد العميل: دين العميل يظهر بالسالب الأحمر، ورصيد العميل له يظهر أخضر بدون علامة ناقص */
  function customerBalanceParts(balance){
    const b=num(balance);
    if(b>0) return {cls:'fee-v4-customer-debt', text:'- '+money(Math.abs(b)), label:'دين على العميل'};
    if(b<0) return {cls:'fee-v4-customer-credit', text:money(Math.abs(b)), label:'رصيد للعميل'};
    return {cls:'text-slate-800', text:money(0), label:'متوازن'};
  }
  window.feeCustomerBalanceText = (b)=>customerBalanceParts(b).text;

  function renderCustomerListItemV4(customer){
    const b=customerBalanceParts(customer.balance||0);

  /* إذا حُذف أو عُدل أي سجل مالي أو فاتورة، أعد الحسابات وزامن الحالة كاملة */
  ['deleteProduct','deleteProductPro','saveEditedInvoice','deleteInvoice','saveExpense','saveExpensePro','deleteExpense','deleteExpensePro','savePurchasePro','deletePurchase','deletePurchasePro','saveAccount','saveAccountPro','deleteAccount','deleteAccountPro','saveSupplierPaymentPro','deleteSupplierPaymentPro','savePayment','saveManualDebt'].forEach(name=>{
    const old=window[name]; if(typeof old==='function' && !old.__feeV4MutWrap){ const w=function(){ const r=old.apply(this,arguments); setTimeout(()=>{ try{ persistChange(name,{fn:name}); }catch(e){} },180); return r; }; w.__feeV4MutWrap=true; window[name]=w; try{ eval(name+'=window[name]'); }catch(e){} }
  });

  /* render نهائي يمنع الرجوع للتصميم القديم */
  const oldRenderV4 = window.render;
  window.render=function(){
    const el=$('app-container');
    try{ if(typeof applyFinalTheme==='function') applyFinalTheme(); else if(typeof applyFullDynamicTheme==='function') applyFullDynamicTheme(); }catch(e){}
    try{ if(state.currentScreen==='customers' && el){ renderCustomersV4(el); return; } if(state.currentScreen==='customerDetail' && el){ renderCustomerDetailV4(el); return; } if(state.currentScreen==='invoices' && el){ renderInvoicesV4(el); return; } }catch(e){ console.warn(e); }
    const r=oldRenderV4 && oldRenderV4.apply(this,arguments);
    setTimeout(()=>{ try{ if(state.currentScreen==='invoices' && el) renderInvoicesV4(el); }catch(e){}; document.body.classList.remove('fee-booting'); },30);
    return r;
  };
  try{ render=window.render; }catch(e){}
  setTimeout(()=>{ try{ arr('products').forEach(normalizeCartonProductV4); if(typeof rebuildCustomerBalances==='function') rebuildCustomerBalances(); if(typeof window.feeFinalRebuildAccountsV3==='function') window.feeFinalRebuildAccountsV3(false); render(); }catch(e){console.warn(e);} finally{ document.body.classList.remove('fee-booting'); } },360);
  window.addEventListener('load',()=>setTimeout(()=>document.body.classList.remove('fee-booting'),900));
})();
</script>

<script id="fee-v5-final-fixes-script">
(function(){
  'use strict';
  if(window.__feeV5FinalFixesApplied) return; window.__feeV5FinalFixesApplied = true;
  const $ = id => document.getElementById(id);
  const $$ = sel => Array.from(document.querySelectorAll(sel));
  const esc = v => String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
  const num = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
  const arr = k => { try{ if(!state.data[k]) state.data[k]=[]; return state.data[k]; }catch(e){ return []; } };
  const nowISO = () => new Date().toISOString();
  const toast = (m,t='success') => { try{ (window.showToast||showToast)(m,t); }catch(e){ console.log(m); } };
  const uid = p => (p||'id')+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  function fmt(d){ try{ return (typeof formatDate==='function'?formatDate(d):new Date(d).toLocaleString('ar-EG')); }catch(e){ return String(d||''); } }
  function money(v){ try{ return (typeof formatCurrency==='function'?formatCurrency(num(v)):num(v).toLocaleString('en-US')+' '+(state.data.settings.currency||'')); }catch(e){ return String(v); } }
  function baseCurCode(){ try{ if(typeof getBaseCurrency==='function') return getBaseCurrency().code; }catch(e){} return state?.data?.settings?.currencyCode || 'ILS'; }
  function unitLabel(t){ return t==='carton'?'كرتونة':t==='kg'?'كيلو':t==='liter'?'لتر':'قطعة'; }
  function piecesValue(){ return Math.max(1, Math.round(num($('prod-pieces')?.value)||1)); }
  function currentProduct(id){ return arr('products').find(p=>p.id===id) || {}; }
  function normalizeOneProduct(p){
    if(!p) return p;
    const unitType = p.unitType || (String(p.unit||'').includes('كرت')?'carton':String(p.unit||'').includes('كيل')?'kg':String(p.unit||'').includes('لتر')?'liter':'piece');
    p.unitType = unitType; p.unit = unitLabel(unitType);
    p.piecesPerCarton = Math.max(1, num(p.piecesPerCarton || p.cartonSize || 1) || 1);
    if(unitType==='carton'){
      const pcs = p.piecesPerCarton;
      const saleCarton = num(p.salePriceCarton ?? p.saleCartonPrice ?? p.cartonSalePrice ?? p.salePrice ?? p.price);
      const costCarton = num(p.costPriceCarton ?? p.costCartonPrice ?? p.cartonCostPrice ?? p.costPrice ?? p.cost);
      p.salePriceCarton = saleCarton;
      p.salePrice = saleCarton;            // السعر الأساسي للكرتونة، والكاشير يقسم عند اختيار قطعة
      p.salePricePiece = +(saleCarton / pcs).toFixed(4);
      p.costPriceCarton = costCarton;
      p.costPrice = costCarton;            // سعر الجملة للكرتونة
      p.costPricePiece = +(costCarton / pcs).toFixed(4);
    }else{
      p.salePrice = num(p.salePrice ?? p.price);
      p.costPrice = num(p.costPrice ?? p.cost);
      delete p.salePriceCarton; delete p.salePricePiece; delete p.costPriceCarton; delete p.costPricePiece;
    }
    p.stock = num(p.stock ?? p.stockBase ?? 0);
    p.lowStock = num(p.lowStock ?? 0);
    p.updatedAt = p.updatedAt || nowISO();
    return p;
  }
  function normalizeAllProducts(){ arr('products').forEach(normalizeOneProduct); }

  function persistV5(type='save', payload={}){
    try{ normalizeAllProducts(); }catch(e){}
    try{ if(typeof window.fatoraRebuildAccountsAndBalances==='function') window.fatoraRebuildAccountsAndBalances(false); }catch(e){}
    try{ if(typeof window.feeFinalRebuildAccountsV3==='function') window.feeFinalRebuildAccountsV3(false); }catch(e){}
    try{ if(typeof rebuildCustomerBalances==='function') rebuildCustomerBalances(); }catch(e){}
    try{ if(typeof enqueueSyncOperation==='function') enqueueSyncOperation({type, payload}); }catch(e){}
    try{ if(typeof saveAppState==='function') saveAppState(); }catch(e){}
    clearTimeout(window.__feeV5CloudTimer);
    window.__feeV5CloudTimer = setTimeout(async()=>{ try{ if(!isLocalOnlyMode() && navigator.onLine && typeof pushFullStateToCloud==='function') await pushFullStateToCloud(); }catch(e){ console.warn(e); } }, 450);
  }

  // لا تظهر شريط المزامنة كلما دخلت قسم
  const oldShowTopSync = window.showTopSync;
  window.showTopSync = function(label, percent){
    const bar=$('top-sync-progress');
    if(!window.__feeV5AllowSyncBar){ if(bar) bar.classList.remove('show','fee-manual-sync'); return; }
    if(bar) bar.classList.add('fee-manual-sync');
    return oldShowTopSync && oldShowTopSync.apply(this, arguments);
  };
  const oldManualSync = window.manualSync;
  if(typeof oldManualSync==='function') window.manualSync = async function(){ window.__feeV5AllowSyncBar=true; try{ return await oldManualSync.apply(this,arguments); } finally{ setTimeout(()=>{ window.__feeV5AllowSyncBar=false; const bar=$('top-sync-progress'); if(bar) bar.classList.remove('fee-manual-sync','show'); },900); } };

  // مودال إضافة/تعديل صنف منسق وصريح مثل الكود المرفوع: قطعة أو كرتونة، مع سعر كرتونة وسعر قطعة محسوب
  window.feeV5UpdateProductUnit = function(){
    const type = $('prod-unit-type')?.value || 'piece';
    const cartonBox = $('prod-carton-box');
    const costLabel = $('prod-cost')?.closest('div')?.querySelector('label');
    const saleLabel = $('prod-sale')?.closest('div')?.querySelector('label');
    const help = $('prod-stock-help');
    const preview = $('fee-v5-unit-preview');
    if(cartonBox) cartonBox.style.display = type==='carton' ? 'block' : 'none';
    if(costLabel) costLabel.textContent = type==='carton' ? 'سعر الشراء / الجملة للكرتونة' : 'سعر الجملة للوحدة';
    if(saleLabel) saleLabel.textContent = type==='carton' ? 'سعر البيع للكرتونة' : 'سعر البيع للوحدة';
    if(help) help.textContent = type==='carton' ? 'اكتب عدد الكراتين، وسيتم تخزين المخزون داخلياً كقطع.' : (type==='piece'?'اكتب عدد القطع.':'يمكن إدخال كسور مثل 0.250');
    if(preview){
      if(type!=='carton'){ preview.style.display='none'; preview.innerHTML=''; }
      else{
        const pcs = piecesValue(); const cost = num($('prod-cost')?.value); const sale = num($('prod-sale')?.value);
        preview.style.display='block';
        preview.innerHTML = `الكرتونة = <b>${pcs}</b> قطعة<br>سعر شراء القطعة بعد القسمة: <b>${money(cost/pcs)}</b><br>سعر بيع القطعة بعد القسمة: <b>${money(sale/pcs)}</b><br><span class="fee-v5-sale-note">في الكاشير: إذا اخترت قطعة يحسب سعر القطعة، وإذا اخترت كرتونة يحسب سعر الكرتونة كاملة.</span>`;
      }
    }
  };

  function productStockInputValue(p){
    if(!p || !p.id) return 0;
    normalizeOneProduct(p);
    return p.unitType==='carton' ? +(num(p.stock)/Math.max(1,num(p.piecesPerCarton)||1)).toFixed(3) : num(p.stock);
  }
  window.showProductModalPro = window.showProductModal = function(id=''){
    normalizeAllProducts();
    const p = normalizeOneProduct({...currentProduct(id)});
    const unit = p.unitType || 'piece';
    const costValue = unit==='carton' ? num(p.costPriceCarton ?? p.costPrice) : num(p.costPrice);
    const saleValue = unit==='carton' ? num(p.salePriceCarton ?? p.salePrice) : num(p.salePrice);
    const body = `<div class="fee-two-grid">
      <input id="prod-id" type="hidden" value="${esc(id)}">
      <div><label class="block text-sm font-bold mb-2">اسم الصنف</label><input id="prod-name" class="input" value="${esc(p.name||'')}"></div>
      <div><label class="block text-sm font-bold mb-2">التصنيف</label><input id="prod-category" class="input" value="${esc(p.category||'عام')}"></div>
      <div><label class="block text-sm font-bold mb-2">الكود</label><input id="prod-code" class="input" value="${esc(p.code||'')}"></div>
      <div><label class="block text-sm font-bold mb-2">الباركود</label><div class="grid grid-cols-[1fr_46px] gap-2"><input id="prod-barcode" class="input" value="${esc(p.barcode||'')}"><button type="button" onclick="openFeeScanner&&openFeeScanner('prod-barcode','input')" class="btn rounded-2xl bg-slate-900 text-white"><i class="fas fa-camera"></i></button></div></div>
      <div><label class="block text-sm font-bold mb-2">نوع البيع</label><select id="prod-unit-type" class="select" onchange="feeV5UpdateProductUnit()"><option value="piece" ${unit==='piece'?'selected':''}>قطعة</option><option value="carton" ${unit==='carton'?'selected':''}>كرتونة</option><option value="kg" ${unit==='kg'?'selected':''}>كيلو</option><option value="liter" ${unit==='liter'?'selected':''}>لتر</option></select></div>
      <div id="prod-carton-box"><label class="block text-sm font-bold mb-2">الكرتونة تحتوي على كم قطعة</label><input id="prod-pieces" class="input" type="number" step="1" min="1" value="${esc(p.piecesPerCarton||1)}" oninput="feeV5UpdateProductUnit()"></div>
      <div><label class="block text-sm font-bold mb-2">المخزون المدخل</label><input id="prod-stock" class="input" type="number" step="0.001" value="${esc(productStockInputValue(p))}"><div id="prod-stock-help" class="fee-input-help"></div></div>
      <div><label class="block text-sm font-bold mb-2">حد البضاعة الناقصة</label><input id="prod-low" class="input" type="number" step="0.001" value="${esc(p.lowStock??0)}"></div>
      <div><label class="block text-sm font-bold mb-2">سعر الجملة للوحدة</label><input id="prod-cost" class="input" type="number" step="0.01" value="${esc(costValue)}" oninput="feeV5UpdateProductUnit()"></div>
      <div><label class="block text-sm font-bold mb-2">سعر البيع للوحدة</label><input id="prod-sale" class="input" type="number" step="0.01" value="${esc(saleValue)}" oninput="feeV5UpdateProductUnit()"></div>
      <div id="fee-v5-unit-preview" class="fee-v5-unit-preview"></div>
    </div>`;
    const footer = `<div class="flex gap-2"><button onclick="closeModal()" class="btn flex-1 py-3 rounded-2xl bg-slate-100 font-bold">إلغاء</button><button onclick="saveProductPro()" class="btn flex-1 py-3 rounded-2xl bg-blue-600 text-white font-extrabold">حفظ</button></div>`;
    try{ openModal({title:id?'تعديل صنف':'إضافة صنف',maxWidth:'820px',body,footer}); }catch(e){ console.error(e); }
    setTimeout(window.feeV5UpdateProductUnit, 30);
  };
  try{ showProductModalPro=window.showProductModalPro; showProductModal=window.showProductModal; }catch(e){}
  window.toggleProductUnitFields = window.feeV5UpdateProductUnit;
  try{ toggleProductUnitFields=window.feeV5UpdateProductUnit; }catch(e){}

  window.saveProductPro = window.saveProduct = function(){
    const id = $('prod-id')?.value || '';
    const name = ($('prod-name')?.value || '').trim();
    if(!name){ toast('أدخل اسم الصنف','error'); return; }
    const unitType = $('prod-unit-type')?.value || 'piece';
    const pcs = piecesValue();
    const entered = num($('prod-stock')?.value);
    const addedStock = unitType==='carton' ? entered * pcs : entered;
    const code = ($('prod-code')?.value||'').trim();
    const barcode = ($('prod-barcode')?.value||'').trim();
    let products = arr('products');
    let idx = id ? products.findIndex(p=>p.id===id) : products.findIndex(p=>(barcode && p.barcode===barcode) || (code && p.code===code));
    const existing = idx>=0 ? normalizeOneProduct(products[idx]) : null;
    const isAddToExistingStock = !!existing && !id;
    const costInput = num($('prod-cost')?.value);
    const saleInput = num($('prod-sale')?.value);
    const costPerPieceNew = unitType==='carton' ? costInput/pcs : costInput;
    const salePerPieceNew = unitType==='carton' ? saleInput/pcs : saleInput;
    const payload = {
      id: id || existing?.id || uid('prod'), name,
      category: ($('prod-category')?.value||'عام').trim() || 'عام',
      code, barcode, unitType, unit: unitLabel(unitType), piecesPerCarton: pcs,
      stock: addedStock, lowStock: num($('prod-low')?.value),
      costPrice: unitType==='carton' ? costInput : costPerPieceNew,
      salePrice: unitType==='carton' ? saleInput : salePerPieceNew,
      costPriceCarton: unitType==='carton' ? costInput : undefined,
      salePriceCarton: unitType==='carton' ? saleInput : undefined,
      costPricePiece: unitType==='carton' ? +costPerPieceNew.toFixed(4) : undefined,
      salePricePiece: unitType==='carton' ? +salePerPieceNew.toFixed(4) : undefined,
      costCurrency: existing?.costCurrency || baseCurCode(), saleCurrency: existing?.saleCurrency || baseCurCode(), updatedAt: nowISO()
    };
    if(isAddToExistingStock){
      const oldStock = num(existing.stock);
      const oldPieceCost = existing.unitType==='carton' ? num(existing.costPriceCarton ?? existing.costPrice)/Math.max(1,num(existing.piecesPerCarton)||1) : num(existing.costPrice);
      const newStock = oldStock + addedStock;
      const avgPieceCost = newStock>0 ? ((oldStock*oldPieceCost) + (addedStock*costPerPieceNew)) / newStock : costPerPieceNew;
      payload.stock = newStock;
      payload.costPrice = unitType==='carton' ? +(avgPieceCost*pcs).toFixed(4) : +avgPieceCost.toFixed(4);
      payload.costPriceCarton = unitType==='carton' ? +(avgPieceCost*pcs).toFixed(4) : undefined;
      payload.costPricePiece = unitType==='carton' ? +avgPieceCost.toFixed(4) : undefined;
      payload.lastCostFormula = `متوسط الجملة: (${oldStock} × ${oldPieceCost.toFixed(3)}) + (${addedStock} × ${costPerPieceNew.toFixed(3)}) ÷ ${newStock} = ${avgPieceCost.toFixed(3)}`;
      products[idx] = normalizeOneProduct({...existing, ...payload});
    }else if(idx>=0){
      products[idx] = normalizeOneProduct({...existing, ...payload});
    }else{
      products.push(normalizeOneProduct({...payload, createdAt:nowISO()}));
    }
    try{ closeModal(); }catch(e){}
    persistV5(idx>=0 ? 'edit_product' : 'add_product', {productId:payload.id});
    try{ if(typeof refreshShortages==='function') refreshShortages(false); }catch(e){}
    try{ render(); }catch(e){}
    toast(isAddToExistingStock && payload.lastCostFormula ? 'تم تحديث المخزون ومتوسط الجملة' : 'تم حفظ الصنف','success');
  };
  try{ saveProductPro=window.saveProductPro; saveProduct=window.saveProduct; }catch(e){}

  // إصلاح أسعار الكرتونة في الكاشير حتى لو الدوال القديمة محلية: المنتج نفسه يخزن سعر الكرتونة في salePrice، والقطعة salePrice/pieces.
  const oldSetCartUnitPro = window.setCartUnitPro;
  if(typeof oldSetCartUnitPro==='function') window.setCartUnitPro = function(i,unitKey){ normalizeAllProducts(); return oldSetCartUnitPro.apply(this, arguments); };
  const oldAddToCart = window.addProductToCartPro;
  if(typeof oldAddToCart==='function') window.addProductToCartPro = function(productId){ normalizeAllProducts(); return oldAddToCart.apply(this, arguments); };

  // مشتريات/إضافة مخزون: متوسط سعر الجملة حسب مجموع (الكمية × السعر) ÷ إجمالي الكميات
  const oldSavePurchase = window.savePurchasePro;
  if(typeof oldSavePurchase==='function') window.savePurchasePro = function(){
    const pid = $('pur-product-id')?.value || $('pur-product')?.value || '';
    const p = arr('products').find(x=>x.id===pid);
    const oldStock = p ? num(p.stock) : 0;
    const oldPieceCost = p ? (p.unitType==='carton' ? num(p.costPriceCarton ?? p.costPrice)/Math.max(1,num(p.piecesPerCarton)||1) : num(p.costPrice)) : 0;
    const r = oldSavePurchase.apply(this, arguments);
    setTimeout(()=>{
      try{
        const prod = arr('products').find(x=>x.id===pid); if(!prod) return;
        normalizeOneProduct(prod);
        const added = Math.max(0, num(prod.stock)-oldStock);
        const pur = arr('purchases').slice().reverse().find(x=>x.productId===pid);
        const amount = num(pur?.amount ?? pur?.price ?? $('pur-amount')?.value);
        if(added>0 && amount>0){
          const newPieceCost = amount/added;
          const finalStock = num(prod.stock);
          const avg = finalStock>0 ? ((oldStock*oldPieceCost)+(added*newPieceCost))/finalStock : newPieceCost;
          if(prod.unitType==='carton'){
            const pcs=Math.max(1,num(prod.piecesPerCarton)||1);
            prod.costPricePiece=+avg.toFixed(4); prod.costPriceCarton=+(avg*pcs).toFixed(4); prod.costPrice=prod.costPriceCarton;
          }else prod.costPrice=+avg.toFixed(4);
          prod.lastCostFormula=`متوسط الجملة: (${oldStock} × ${oldPieceCost.toFixed(3)}) + (${added} × ${newPieceCost.toFixed(3)}) ÷ ${finalStock} = ${avg.toFixed(3)}`;
          persistV5('purchase_avg_cost',{productId:pid});
        }
      }catch(e){ console.warn(e); }
    },120);
    return r;
  };
  try{ savePurchasePro=window.savePurchasePro; }catch(e){}

    const data = customerRows(customerId); const c=data.customer; if(!c) return '';
    const s = settings();
    const rows = data.rows.map(r=>`<tr><td>${esc(fmt(r.date))}</td><td>${esc(r.type)}</td><td>${esc(r.ref || '-')}</td><td>${r.debit?money(r.debit):'-'}</td><td>${r.credit?money(r.credit):'-'}</td><td><b>${money(r.balance)}</b></td></tr>`).join('') || `<tr><td colspan="6" style="text-align:center;color:#64748b;padding:18px">لا توجد حركات</td></tr>`;
    const totalDebit = data.rows.reduce((a,r)=>a+num(r.debit),0);
    const totalCredit = data.rows.reduce((a,r)=>a+num(r.credit),0);
    return `<div class="fee-final-a4-paper">
      <div class="fee-final-a4-head"><div style="display:flex;gap:12px;align-items:center">${s.logo?`<img class="fee-final-a4-logo" crossorigin="anonymous" src="${esc(s.logo)}">`:''}<div><div class="fee-final-a4-title">${esc(s.shopName || s.companyName || 'اسم الشركة')}</div><div class="fee-final-a4-sub">كشف حساب عميل مفصل<br>${esc(s.shopPhone || '')} ${s.shopAddress ? ' · '+esc(s.shopAddress) : ''}</div></div></div><div class="fee-final-a4-sub">تاريخ الطباعة<br><b>${esc(fmt(new Date().toISOString()))}</b></div></div>
      <div class="fee-final-info-grid"><div class="fee-final-info-box"><small>اسم العميل</small><b>${esc(c.name || '-')}</b></div><div class="fee-final-info-box"><small>الجوال</small><b>${esc(c.phone || '-')}</b></div><div class="fee-final-info-box"><small>العنوان</small><b>${esc(c.address || '-')}</b></div><div class="fee-final-info-box"><small>الرصيد الحالي</small><b>${money(c.balance ?? data.balance)}</b></div></div>
      <table class="fee-final-table"><thead><tr><th>التاريخ</th><th>النوع</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="3">الإجماليات</td><td>${money(totalDebit)}</td><td>${money(totalCredit)}</td><td>${money(c.balance ?? data.balance)}</td></tr></tfoot></table>
    </div>`;
  }
  window.buildCustomerStatementHTML = customerTableHtml;
  window.printCustomerStatement = function(customerId){ const html=customerTableHtml(customerId); if(html) directPrint(html, 'a4'); };
  window.printCustomerCard = window.printCustomerStatement;

  function downloadBlob(blob, name){
    try{ if(typeof robustDownloadBlob === 'function') return robustDownloadBlob(blob,name); }catch(e){}
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  }
  window.downloadCustomerPDF = function(customerId){
    const data=customerRows(customerId); const c=data.customer; if(!c) return;
    try{
      const jsPDF = window.jspdf?.jsPDF || window.jsPDF; if(!jsPDF) throw new Error('jspdf');
      const pdf = new jsPDF({orientation:'p',unit:'mm',format:'a4'});
      const rtl = txt => { try{ return pdf.processArabic ? pdf.processArabic(String(txt ?? '')) : String(txt ?? ''); }catch(e){ return String(txt ?? ''); } };
      pdf.setFontSize(14); pdf.text(rtl(`كشف حساب: ${c.name || ''}`), 200, 14, {align:'right'});
      pdf.setFontSize(10); pdf.text(rtl(`${settings().shopName || settings().companyName || ''} - ${fmt(new Date().toISOString())}`), 200, 21, {align:'right'});
      const body=data.rows.map(r=>[rtl(fmt(r.date)), rtl(r.type), rtl(r.ref||'-'), money(r.debit||0), money(r.credit||0), money(r.balance||0)]);
      pdf.autoTable({head:[[rtl('التاريخ'),rtl('النوع'),rtl('البيان'),rtl('مدين'),rtl('دائن'),rtl('الرصيد')]],body,styles:{fontSize:8,halign:'right'},headStyles:{halign:'right'},startY:28,theme:'grid'});
      pdf.save(`customer_${sanitizeFile(c.name || c.id)}.pdf`);
      toast('تم تنزيل كشف العميل PDF','success');
    }catch(e){ console.error(e); const html=customerTableHtml(customerId); const blob=new Blob(['<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>كشف حساب</title></head><body>'+html+'</body></html>'],{type:'text/html;charset=utf-8'}); downloadBlob(blob,`customer_${sanitizeFile(c.name || c.id)}.html`); toast('تم تنزيل كشف العميل كملف جدول HTML للطباعة PDF','warning'); }
  };
  window.downloadCustomerImage = function(customerId){
    const data=customerRows(customerId); const c=data.customer; if(!c) return;
    const rowH=34, width=1200, top=170, height=Math.max(420, top + rowH*(data.rows.length+2) + 40);
    const cols=[160,150,300,160,160,170]; const heads=['التاريخ','النوع','البيان','مدين','دائن','الرصيد'];
    let x=width-30; const colXs=[]; cols.forEach(w=>{ colXs.push({x:x-w,w}); x-=w; });
    const text=(v,xx,yy,size=22,weight='700')=>`<text x="${xx}" y="${yy}" font-size="${size}" font-weight="${weight}" text-anchor="end" direction="rtl" unicode-bidi="bidi-override" font-family="Cairo,Arial">${esc(v)}</text>`;
    let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><rect width="100%" height="100%" fill="#fff"/><rect x="30" y="28" width="1140" height="92" rx="18" fill="#f8fafc" stroke="#dbe4ee"/>${text(settings().shopName||settings().companyName||'اسم الشركة',1140,62,28,'900')}${text('كشف حساب العميل: '+(c.name||''),1140,98,22,'800')}${text('الرصيد الحالي: '+money(c.balance ?? data.balance),420,80,22,'900')}`;
    let y=top;
    svg += `<rect x="30" y="${y-28}" width="1140" height="34" fill="#f1f5f9" stroke="#d7dee8"/>`;
    heads.forEach((h,i)=>{ const cpos=colXs[i]; svg += text(h,cpos.x+cpos.w-10,y-5,18,'900'); });
    data.rows.forEach((r,idx)=>{ y += rowH; svg += `<rect x="30" y="${y-28}" width="1140" height="34" fill="${idx%2?'#ffffff':'#fbfdff'}" stroke="#e5e7eb"/>`; [fmt(r.date),r.type,r.ref||'-',r.debit?money(r.debit):'-',r.credit?money(r.credit):'-',money(r.balance)].forEach((v,i)=>{ const cpos=colXs[i]; svg += text(String(v).slice(0,34),cpos.x+cpos.w-10,y-6,16,'700'); }); });
    svg += `</svg>`;
    downloadBlob(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),`customer_${sanitizeFile(c.name || c.id)}.svg`);
    toast('تم تنزيل كشف العميل كصورة جدول SVG','success');
  };

  window.printHtml = function(html){ directPrint(`<div class="fee-final-a4-paper">${html || ''}</div>`, 'a4'); };
  window.safePrintFromCanvas = function(rendererFn){
    try{
      const id = state?.selectedCustomerId;
      if(id && customerById(id)) return window.printCustomerStatement(id);
      const invId = state?.selectedInvoiceId;
      if(invId && invoiceById(invId)) return window.printInvoice(invId);
    }catch(e){}
    toast('تم إلغاء طباعة السكرين شوت. استخدم طباعة الجدول أو الفاتورة الحرارية.','warning');
  };

  function patchButtons(){
    normalizeProductsFinal();
    if(state?.currentScreen === 'invoiceDetail'){
      const id = state.selectedInvoiceId;
      $$('button,a').forEach(btn=>{
        const txt = String(btn.textContent || '').trim();
        if(txt.includes('طباعة')) btn.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); window.printInvoice(id); };
        if(txt === 'PDF' || txt.includes('PDF')) btn.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); window.printInvoice(id); toast('اختر حفظ PDF من نافذة الطباعة الحرارية','warning'); };
      });
    }
    if(state?.currentScreen === 'customerDetail'){
      const cid = state.selectedCustomerId; if(!cid) return;
      const printBtns = $$('button').filter(b=>String(b.textContent||'').includes('طباعة'));
      printBtns.forEach(b=>{ b.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); window.printCustomerStatement(cid); }; });
      const host = printBtns[0]?.parentElement;
      if(host && !host.querySelector('[data-fee-final-customer-export="1"]')){
        host.insertAdjacentHTML('beforeend', `<button data-fee-final-customer-export="1" onclick="downloadCustomerPDF('${esc(cid)}')" class="fatora-chip red"><i class="fas fa-file-pdf"></i> PDF</button><button data-fee-final-customer-export="1" onclick="downloadCustomerImage('${esc(cid)}')" class="fatora-chip green"><i class="fas fa-image"></i> صورة</button><button data-fee-final-customer-export="1" onclick="downloadCustomerExcel('${esc(cid)}')" class="fatora-chip teal"><i class="fas fa-file-excel"></i> Excel</button>`);
      }
    }
  }
  const prevRender = window.render;
  window.render = function(){ const r = prevRender && prevRender.apply(this, arguments); setTimeout(patchButtons, 80); return r; };
  try{ render = window.render; }catch(e){}
  setTimeout(()=>{ try{ normalizeProductsFinal(); patchButtons(); }catch(e){} },500);
})();
</script>

<script id="fee-pwa-install-script">
(function(){
  'use strict';
  if (window.__feePwaInstallReady) return;
  window.__feePwaInstallReady = true;
  function toastMsg(msg){
    try { if (typeof showToast === 'function') showToast(msg, 'success'); else console.log(msg); } catch(e){ console.log(msg); }
  }
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(err){ console.warn('SW register failed', err); });
    });
  }
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    try { document.body.classList.add('pwa-install-available'); } catch(_) {}
  });
  window.feeInstallApp = async function(){
    if (!deferredPrompt) { toastMsg('افتح قائمة Chrome ثم اختر: تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية'); return; }
    deferredPrompt.prompt();
    try { await deferredPrompt.userChoice; } catch(_) {}
    deferredPrompt = null;
  };
  document.addEventListener('click', function(ev){
    var t = ev.target && ev.target.closest ? ev.target.closest('[data-install-app]') : null;
    if(t){ ev.preventDefault(); window.feeInstallApp(); }
  }, true);
})();
</script>
